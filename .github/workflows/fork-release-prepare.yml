name: Fork Release CI

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful full Fork Checks run ID for this exact commit
        required: true
        type: string
      brand:
        description: Repository brand ID
        required: true
        default: eddy
        type: string
      stage:
        description: Deployment profile stage
        required: true
        default: beta
        type: choice
        options: [beta, production]
      inventory_json:
        description: CF3 resource inventory JSON (resource IDs and secret references only)
        required: false
        type: string
      continue_from:
        description: Retained incomplete Cloudflare first-release journal to qualify
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-prepare-${{ github.ref }}-${{ inputs.brand }}-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Freeze delivery artifacts
    if: github.repository == 'summersmile1984/omi'
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64","mac-studio","memweft"]') }}
    timeout-minutes: 180
    outputs:
      artifact: delivery-${{ github.sha }}-${{ inputs.brand }}-${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse complete CI for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 scripts/fork/release_ci.py ci --run-id "$RELEASE_CI_RUN_ID" --sha "$GITHUB_SHA"

      - uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Provision pinned backend and fork dependencies
        run: |
          uv python install 3.12
          fork_python=$(uv python find --managed-python 3.12)
          PATH="$(dirname "$fork_python"):$PATH"
          export PATH
          make setup-backend
          uv pip install --python backend/.venv/bin/python --no-deps --require-hashes -r backend/requirements-fork.txt
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            auth-server/package-lock.json
            deploy/cloudflare/package-lock.json
            scripts/brand/raster/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Provision frozen build dependencies
        run: |
          npm ci --prefix auth-server --ignore-scripts --no-audit --no-fund
          npm ci --prefix deploy/cloudflare --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/brand/raster --ignore-scripts --no-audit --no-fund
          (cd web/app && bun install --frozen-lockfile)
          docker info --format '{{.OSType}}'

      - name: Freeze both deployment deliverables
        env:
          RELEASE_BRAND: ${{ inputs.brand }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_INVENTORY: ${{ inputs.inventory_json || (inputs.stage == 'beta' && vars.CF_INVENTORY_BETA || vars.CF_INVENTORY_PRODUCTION) }}
          RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_CONTINUE_FROM: ${{ inputs.continue_from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/fork-delivery.XXXXXX")
          export RELEASE_WORK="$work"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RELEASE_WORK']) / 'inventory.json'
          path.write_text(json.dumps(json.loads(os.environ['RELEASE_INVENTORY'])))
          path.chmod(0o600)
          PY
          unset RELEASE_INVENTORY
          python3 scripts/fork/prepare_release.py --brand "$RELEASE_BRAND" --stage "$RELEASE_STAGE" \
            --inventory "$work/inventory.json" --output "$work/delivery" --ci-run-id "$RELEASE_CI_RUN_ID" \
            --continue-from "$RELEASE_CONTINUE_FROM"
          echo "RELEASE_OUT=$work/delivery" >> "$GITHUB_ENV"
          {
            echo '### Prepared deployment artifacts'
            echo "Source: $GITHUB_SHA"
            echo 'Cloudflare: nine frozen Workers, assets, SQL and both Web targets.'
            echo 'Server OS: Linux amd64 backend, auth and Web images; native inference profiles also include the LLM runtime.'
            echo 'delivery.json binds source, image IDs, archive hashes and Cloudflare continuation intent. Artifact qualification runs next.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Preserve hidden Worker modules and filesystem metadata inside the tar.
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.sha }}-${{ inputs.brand }}-${{ inputs.stage }}
          path: |
            ${{ env.RELEASE_OUT }}/cloudflare.tar.gz
            ${{ env.RELEASE_OUT }}/server-images.tar
            ${{ env.RELEASE_OUT }}/source.tar.gz
            ${{ env.RELEASE_OUT }}/delivery.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  cloudflare:
    name: Cloudflare artifact qualification
    needs: prepare
    uses: ./.github/workflows/fork-cd-cloudflare.yml
    secrets: inherit
    with:
      delivery_run_id: ${{ format('{0}', github.run_id) }}
      stage: ${{ inputs.stage }}
      qualification_artifact: ${{ needs.prepare.outputs.artifact }}

  server:
    name: Server image qualification
    needs: prepare
    uses: ./.github/workflows/fork-cd-server.yml
    with:
      delivery_run_id: ${{ format('{0}', github.run_id) }}
      stage: ${{ inputs.stage }}
      qualification_artifact: ${{ needs.prepare.outputs.artifact }}

  ready:
    name: Release ready
    if: always()
    needs: [prepare, cloudflare, server]
    runs-on: ubuntu-latest
    steps:
      - name: Require every artifact qualification
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare.result }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$CLOUDFLARE_RESULT" = success
          test "$SERVER_RESULT" = success
          echo 'The exact GitHub delivery passed transport, Cloudflare runtime/schema and Server image boot qualification. CD may consume this run.' >> "$GITHUB_STEP_SUMMARY"
