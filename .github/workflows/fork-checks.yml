name: Fork Checks

# Fork-owned CI for summersmile1984/omi. Pull requests use disposable GitHub-hosted
# runners; trusted branch pushes and manual runs use the fork's self-hosted runners
# (x86 Linux for the portable gate, Mac Studio for the macOS-native contracts).
# Upstream workflow files remain unchanged and keep their own repository settings.
#
# Three lanes share this file; the lane is the event, and it decides both the
# selection scope and whether the run can authorize a release:
#   pull_request       hosted runners,  diff against the target branch, no release
#   push               self-hosted x86, diff against the event's `before`, no release
#   workflow_dispatch  self-hosted x86, the complete manifest, the release lane
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**", "sync/**"]
  workflow_dispatch:

# Keyed by lane as well as ref: a manual full run and the post-merge push run
# both resolve to refs/heads/main, and a shared group let the release lane cancel
# the merge commit's own record. Same-lane runs still supersede each other.
concurrency:
  group: fork-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # `fork-repo-state` lists the repository's workflows and reads their
  # enabled/disabled state; that needs the Actions API.
  actions: read

jobs:
  fork-gate:
    name: Fork gate (Server OS + Cloudflare)
    if: github.repository == 'summersmile1984/omi'
    # Portable contracts are Linux-native, so trusted pushes and the release lane run
    # them on the fork's x86 runner instead of emulating amd64 on the ARM Mac Studio.
    # `fork-selfhost-product-core` builds images and runs compose, and its Server OS
    # target is linux/amd64: on Mac Studio that was qemu-emulated, and the fixture's
    # own admission checks read the host it runs on. Pull requests keep using
    # disposable GitHub-hosted runners so untrusted code never reaches a self-hosted box.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux-x64"]') }}
    timeout-minutes: 120
    env:
      FORK_FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' }}
      # Only the complete lane writes one; it is uploaded below and read by the
      # release admission as proof that this job ran the whole manifest.
      FORK_CI_ATTESTATION: ${{ github.workspace }}/fork-ci-attestation.json
      # `fork-repo-state` lists the repository's workflows and reads their
      # enabled/disabled state. `gh` needs a token in the environment; the job
      # permissions above keep it read-only, and a fork pull request gets a
      # read-only token from GitHub regardless.
      GH_TOKEN: ${{ github.token }}
    outputs:
      base: ${{ steps.base.outputs.ref }}
      macos: ${{ steps.platforms.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The lane's one observed infra flake (2026-09-15T10:41Z): this download aborted with
      # "The operation was aborted due to timeout" and, because the step precedes every
      # check, the whole gate reported a failure no code caused -- the same commit passed
      # 22 seconds later. The action exposes no retry input, so the step retries as a unit
      # and the second attempt reuses whatever the first managed to download.
      - name: Install uv
        id: install-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install uv (retry after a transient download failure)
        if: steps.install-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      # Managed Python is relocatable and installs under the runner account.
      # setup-python's macOS archives require /Users/runner/hostedtoolcache.
      - name: Provision CI Python
        run: |
          uv python install 3.12
          fork_python=$(uv python find --managed-python 3.12)
          dirname "$fork_python" >> "$GITHUB_PATH"

      # The guard classifies a file as "upstream" by its presence in
      # upstream/main, so without this ref it can only skip. Fetch it explicitly
      # rather than letting the check pass on an empty definition.
      - name: Fetch upstream ref
        run: |
          git remote add upstream https://github.com/BasedHardware/omi.git 2>/dev/null || true
          git config remote.upstream.tagOpt --no-tags
          git fetch --no-tags upstream main
          git update-ref refs/remotes/upstream/main FETCH_HEAD
          echo "upstream/main = $(git rev-parse --short refs/remotes/upstream/main)"

      - name: Resolve diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            ref=FETCH_HEAD
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE_SHA"
          else
            # New branch pushes and manual runs qualify the whole fork branch.
            git fetch --no-tags origin main
            ref=$(git merge-base HEAD FETCH_HEAD)
            # On main itself, retain a non-empty current-commit review range.
            if [ "$ref" = "$(git rev-parse HEAD)" ]; then
              ref=HEAD^
            fi
          fi
          resolved=$(git rev-parse --verify --end-of-options "$ref^{commit}")
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"

      - name: Validate fork ownership before dependency provisioning
        env:
          DIFF_BASE: ${{ steps.base.outputs.ref }}
        run: |
          python3 .github/scripts/run_checks.py \
            --manifest .github/checks-manifest.fork.yaml --lane ci \
            --base "$DIFF_BASE" --platform linux --check-id fork-upstream-touch

      - name: Provision backend environment
        run: |
          make setup-backend
          uv pip install --python backend/.venv/bin/python --no-deps --require-hashes -r backend/requirements-fork.txt
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      # fork-selfhost-startup runs fork/tests/test_speech_contract.py, which shells
      # out to ffmpeg to build the encoded audio fixtures used by the MiMo
      # converter regressions. The CI runner image (ubuntu-latest) does not ship
      # ffmpeg by default; installing it here keeps the fixture bytes reproducible
      # without touching the upstream test, which the T2 policy forbids. The
      # `|| true` makes the failure soft: test_hosted_speech.py already gates its
      # own ffmpeg-dependent cases with `pytest.mark.skipif(shutil.which('ffmpeg')
      # is None)`, so a missing binary never breaks the rest of the lane.
      - name: Provision ffmpeg for speech-contract fixtures
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg && ffmpeg -version | head -1

      - name: Select platform checks
        id: platforms
        env:
          DIFF_BASE: ${{ steps.base.outputs.ref }}
        run: |
          python3 scripts/fork/run_checks.py \
            --lane ci --base "$DIFF_BASE" --platform macos \
            --exclusive-platform --output json > "$RUNNER_TEMP/fork-macos-checks.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          selection = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fork-macos-checks.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"macos={str(bool(selection['checks'])).lower()}\n")
          PY

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false

      - name: Provision workflow lint
        run: |
          GOBIN="$RUNNER_TEMP/fork-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/fork-tools" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            auth-server/package-lock.json
            deploy/cloudflare/package-lock.json
            scripts/brand/raster/package-lock.json

      - name: Provision authentication contract dependencies
        run: |
          npm ci --prefix auth-server --ignore-scripts --no-audit --no-fund
          npm ci --prefix deploy/cloudflare --ignore-scripts --no-audit --no-fund

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Provision Web contract dependencies
        working-directory: web/app
        run: bun install --frozen-lockfile

      - name: Select native terminal contract dependencies
        id: flutter
        run: |
          python3 scripts/fork/run_checks.py \
            --lane ci --base "${{ steps.base.outputs.ref }}" --platform linux --output json > /tmp/fork-check-selection.json
          python3 - <<'PY'
          import json, os
          selected = json.load(open('/tmp/fork-check-selection.json'))['checks']
          enabled = any(check['id'] == 'fork-flutter-native-identity' for check in selected)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'enabled={str(enabled).lower()}\n')
              output.write(f"electron={str(any(check['id'] == 'fork-electron-native-identity' for check in selected)).lower()}\n")
              output.write(f"raster={str(any(check['id'] in {'fork-brand-raster', 'fork-flutter-native-identity', 'fork-electron-native-identity'} for check in selected)).lower()}\n")
              output.write(f"server_models={str(any(check['id'] == 'fork-selfhost-product-core' for check in selected)).lower()}\n")
          PY

      - name: Provision shared brand raster dependencies
        if: steps.flutter.outputs.raster == 'true'
        run: npm ci --prefix scripts/brand/raster --ignore-scripts --no-audit --no-fund

      - name: Provision pinned Flutter
        if: steps.flutter.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      - name: Provision frozen Flutter dependencies
        if: steps.flutter.outputs.enabled == 'true'
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Provision Electron package manager
        if: steps.flutter.outputs.electron == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Provision Electron build dependencies
        if: steps.flutter.outputs.electron == 'true'
        working-directory: desktop/windows
        run: pnpm install --frozen-lockfile

      # The product cases run against a real backend fixture. Two runtime
      # shapes are possible:
      #
      #   - Complete canonical native profile: prepare-model.py /
      #     prepare-speech.py download BGE-M3 / Qwen / SenseVoice / Kokoro and
      #     product.sh starts the fixture with all three model stores. This is
      #     the safe shape for untrusted PRs because no business secret leaks
      #     and downloaded bytes are admitted again at startup. The download
      #     is several gigabytes per lane and dominates the gate duration;
      #     it is unavoidable until fork rules allow secrets on PR lanes.
      #
      #   - Hosted operator AI: an OpenAI-compatible vendor (openrouter /
      #     siliconflow / cloudflare-gateway) supplies LLM / ASR / TTS over
      #     the wire. The fixture still binds a local BGE-M3 embedding store
      #     because none of them owns that model; everything else is one
      #     bearer the brand manifest already declared. PR from forks cannot
      #     read repo secrets, so this shape only runs on the trusted lanes
      #     (push, workflow_dispatch).
      - name: Decide Server model runtime
        id: server_runtime
        if: steps.flutter.outputs.server_models == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "shape=native" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.FORK_OPERATOR_OPENROUTER_API_KEY }}" ]; then
            printf '{"OPENROUTER_API_KEY":"%s"}\n' "${{ secrets.FORK_OPERATOR_OPENROUTER_API_KEY }}" \
              > "$RUNNER_TEMP/selfhost-operator.json"
            echo "shape=hosted provider=openrouter secret=$RUNNER_TEMP/selfhost-operator.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.FORK_OPERATOR_SILICONFLOW_API_KEY }}" ]; then
            printf '{"SILICONFLOW_API_KEY":"%s"}\n' "${{ secrets.FORK_OPERATOR_SILICONFLOW_API_KEY }}" \
              > "$RUNNER_TEMP/selfhost-operator.json"
            echo "shape=hosted provider=siliconflow secret=$RUNNER_TEMP/selfhost-operator.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.FORK_OPERATOR_CLOUDFLARE_API_TOKEN }}" ]; then
            printf '{"CLOUDFLARE_API_TOKEN":"%s"}\n' "${{ secrets.FORK_OPERATOR_CLOUDFLARE_API_TOKEN }}" \
              > "$RUNNER_TEMP/selfhost-operator.json"
            echo "shape=hosted provider=cloudflare-gateway secret=$RUNNER_TEMP/selfhost-operator.json" >> "$GITHUB_OUTPUT"
          else
            echo "shape=native" >> "$GITHUB_OUTPUT"
          fi

      # Native model stores. Skip the entire download when the hosted shape is
      # selected above: the fixture no longer needs Qwen / SenseVoice / Kokoro,
      # only BGE-M3 for the embedding dimension contract.
      - name: Provision Server embedding store
        if: steps.server_runtime.outputs.shape == 'native'
        run: |
          python3 deploy/self-host/prepare-model.py --kind embedding --output "$RUNNER_TEMP/selfhost-models/embedding"
      - name: Provision Server LLM and speech stores
        if: steps.server_runtime.outputs.shape == 'native'
        run: |
          python3 deploy/self-host/prepare-model.py --kind llm --output "$RUNNER_TEMP/selfhost-models/llm"
          python3 deploy/self-host/prepare-speech.py --output "$RUNNER_TEMP/selfhost-models/speech"

      - name: Provision hosted operator AI binding
        if: steps.server_runtime.outputs.shape == 'hosted'
        run: |
          # The brand manifest has already declared which provider this stage
          # selects; product.sh reads SELF_HOST_CI_OPERATOR_PROVIDER to mirror that
          # decision. The manifest is the single source of truth, so this step
          # does not need to inspect secrets.
          echo "Operator provider for this lane: ${{ steps.server_runtime.outputs.provider }}"

      # Portable contracts run on either host; macOS-only checks run below.
      # The self-host fixture runs on this same Linux host, natively amd64, so its
      # image builds and compose stack are no longer emulated.
      # Portable contracts run on either host; macOS-only checks run below.
      # The self-host fixture runs on this same Linux host, natively amd64, so its
      # image builds and compose stack are no longer emulated.
      #
      # The runtime-shape branch from the Decide step above determines whether
      # LLM / speech stores are exported to the lane. Compose the env from a
      # small shell script so the YAML stays free of nested template expressions
      # that the GitHub Actions parser refuses.
      - name: Fork manifest (ci lane)
        env:
          # The self-host fixture writes per-command logs; pin them to a stable path
          # so they outlive the run. They used to sit in a mktemp directory that no
          # lane could read, and the job log truncates before the failing command
          # (fork-selfhost-product-core reported "inspect command-09.log" for days
          # with nothing diagnosable anywhere).
          SELF_HOST_CI_REPORT_DIR: ${{ runner.temp }}/selfhost-fixture-report
          SELF_HOST_CI_EMBEDDING_STORE: ${{ runner.temp }}/selfhost-models/embedding
          SERVER_RUNTIME_SHAPE: ${{ steps.server_runtime.outputs.shape }}
          SERVER_RUNTIME_PROVIDER: ${{ steps.server_runtime.outputs.provider }}
          SERVER_RUNTIME_SECRET: ${{ steps.server_runtime.outputs.secret }}
        run: |
          if [ "$SERVER_RUNTIME_SHAPE" = "hosted" ]; then
            export SELF_HOST_CI_OPERATOR_SECRET_FILE="$SERVER_RUNTIME_SECRET"
            export SELF_HOST_CI_OPERATOR_PROVIDER="$SERVER_RUNTIME_PROVIDER"
          else
            export SELF_HOST_CI_LLM_STORE="$RUNNER_TEMP/selfhost-models/llm"
            export SELF_HOST_CI_SPEECH_STORE="$RUNNER_TEMP/selfhost-models/speech"
          fi
          python3 scripts/fork/run_checks.py --lane ci --base "${{ steps.base.outputs.ref }}" --platform linux

      - name: Upload the self-host fixture report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fork-selfhost-fixture-report-${{ github.sha }}
          overwrite: true
          path: ${{ runner.temp }}/selfhost-fixture-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Report upstream divergence
        if: always()
        run: |
          git diff --name-only refs/remotes/upstream/main HEAD | sort -u > /tmp/changed.txt
          git ls-tree -r --name-only refs/remotes/upstream/main | sort -u > /tmp/upstream.txt
          n=$(comm -12 /tmp/changed.txt /tmp/upstream.txt | wc -l | tr -d ' ')
          {
            echo "### Fork divergence"
            echo ""
            echo "Upstream files this branch differs from upstream on: **$n**"
            echo ""
            echo "This number should only fall. It counts everything, including"
            echo "upstream commits not yet merged here, so read it as a trend."
          } >> "$GITHUB_STEP_SUMMARY"

      # Published only by the complete lane, and only when every check passed:
      # a run whose checks failed must not leave evidence a release can read.
      - name: Upload the manifest attestation
        if: ${{ env.FORK_FULL_CHECKS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fork-ci-attestation-linux-${{ github.sha }}
          overwrite: true
          path: fork-ci-attestation.json
          if-no-files-found: error
          retention-days: 30

  fork-macos:
    name: Fork macOS native contracts
    needs: fork-gate
    if: needs.fork-gate.outputs.macos == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-26"]' || '["self-hosted","macOS","ARM64","mac-studio","memweft"]') }}
    timeout-minutes: 60
    env:
      FORK_FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' }}
      FORK_CI_ATTESTATION: ${{ github.workspace }}/fork-ci-attestation.json
      DEVELOPER_DIR: ${{ github.event_name == 'pull_request' && '/Applications/Xcode_26.6.app/Contents/Developer' || '/Applications/Xcode.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The lane's one observed infra flake (2026-09-15T10:41Z): this download aborted with
      # "The operation was aborted due to timeout" and, because the step precedes every
      # check, the whole gate reported a failure no code caused -- the same commit passed
      # 22 seconds later. The action exposes no retry input, so the step retries as a unit
      # and the second attempt reuses whatever the first managed to download.
      - name: Install uv
        id: install-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      - name: Install uv (retry after a transient download failure)
        if: steps.install-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: true
          cache-dependency-glob: backend/pylock*.toml

      # Managed Python is relocatable and installs under the runner account.
      # setup-python's macOS archives require /Users/runner/hostedtoolcache.
      - name: Provision CI Python
        run: |
          uv python install 3.12
          fork_python=$(uv python find --managed-python 3.12)
          dirname "$fork_python" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/brand/raster/package-lock.json

      - name: Provision shared brand raster dependencies
        run: npm ci --prefix scripts/brand/raster --ignore-scripts --no-audit --no-fund

      - name: Verify native compiler
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Install native build dependencies
        timeout-minutes: 10
        run: brew install pkg-config webp

      # Cache downloaded dependencies only; compiled .build paths are stage-specific.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: fork-native-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('desktop/macos/Desktop/Package.resolved') }}

      - name: Run selected native manifest checks
        env:
          DIFF_BASE: ${{ needs.fork-gate.outputs.base }}
        run: |
          python3 scripts/fork/run_checks.py \
            --lane ci --base "$DIFF_BASE" --platform macos --exclusive-platform

      - name: Upload the manifest attestation
        if: ${{ env.FORK_FULL_CHECKS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fork-ci-attestation-macos-${{ github.sha }}
          overwrite: true
          path: fork-ci-attestation.json
          if-no-files-found: error
          retention-days: 30
