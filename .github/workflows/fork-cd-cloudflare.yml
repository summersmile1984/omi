name: Fork CD Cloudflare

on:
  workflow_call:
    inputs:
      delivery_run_id:
        type: string
        required: true
      stage:
        type: string
        required: true
      qualification_artifact:
        description: Frozen artifact from the calling Release CI; only private qualification runs
        type: string
        required: true
      # Declared so the reusable path resolves them explicitly: release
      # qualification always leaves them at these defaults and never resets.
      reset_stage:
        type: boolean
        required: false
        default: false
      reset_confirm:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      delivery_run_id:
        description: Successful Fork Release CI run ID with both artifact qualifications (unused with reset_stage)
        type: string
        required: false
      stage:
        description: Deployment stage
        type: choice
        options: [beta, production]
        default: beta
        required: true
      # One-time recovery, not a release: a stage can be stuck between the
      # continuation contract (already-published Workers must be byte-identical)
      # and the first-release contract (Workers absent, D1 authorities empty), and
      # the release owner implements neither an update nor a rollback for that
      # state. It lives here rather than in its own workflow because this file
      # already owns this stage's mutation surface -- and because a new workflow
      # binding this secret would be an unclassified deployment binding that the
      # upstream boundary check refuses and the fork cannot reclassify.
      reset_stage:
        description: Delete this stage's Workers and empty its D1 authorities
        type: boolean
        required: false
        default: false
      reset_confirm:
        description: 'With reset_stage: type reset:eddy:<stage> to confirm'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-cd-cloudflare-eddy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve delivery
    if: github.repository == 'summersmile1984/omi' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64","mac-studio","memweft"]') }}
    outputs:
      sha: ${{ steps.delivery.outputs.sha }}
      artifact: ${{ steps.delivery.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: delivery
        # A reset dispatch has no delivery to resolve.
        if: ${{ !inputs.reset_stage }}
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
          RELEASE_STAGE: ${{ inputs.stage }}
          QUALIFICATION_ARTIFACT: ${{ inputs.qualification_artifact }}
        run: |
          if [ -n "$QUALIFICATION_ARTIFACT" ]; then
            test "$DELIVERY_RUN_ID" = "$GITHUB_RUN_ID"
            test "$QUALIFICATION_ARTIFACT" = "delivery-$GITHUB_SHA-eddy-$RELEASE_STAGE"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "artifact=$QUALIFICATION_ARTIFACT" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/fork/release_ci.py resolve --run-id "$DELIVERY_RUN_ID" --stage "$RELEASE_STAGE"
          fi

  deploy:
    name: Execute accepted delivery
    needs: resolve
    environment: cloudflare-${{ inputs.stage }}
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64","mac-studio","memweft"]') }}
    timeout-minutes: 180
    steps:
      - name: Require Cloudflare deployment credentials
        if: ${{ !inputs.reset_stage }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SECRETS_JSON: ${{ secrets.RELEASE_SECRETS_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$RELEASE_SECRETS_JSON" ]; then
            echo 'Cloudflare environment credentials are unavailable; check the selected environment and reusable-workflow secret inheritance.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ !inputs.reset_stage }}
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/fork-release-tools
        if: ${{ !inputs.reset_stage }}
      - name: Prepare Cloudflare HTTP contract Python
        if: ${{ !inputs.reset_stage }}
        run: |
          uvx uv==0.12.3 venv --python 3.14 deploy/cloudflare/python/api-core/.venv
          deploy/cloudflare/python/api-core/.venv/bin/python contracts/deployment/core.py --help
      - name: Load release admission from workflow revision
        if: ${{ !inputs.reset_stage }}
        run: |
          admission_dir="$RUNNER_TEMP/fork-release-admission"
          mkdir "$admission_dir"
          for file in release_ci.py release_archive.py download_delivery.py; do
            git show "$GITHUB_WORKFLOW_SHA:scripts/fork/$file" > "$admission_dir/$file"
          done
          python3 "$admission_dir/release_ci.py" --help
      - name: Download complete frozen delivery
        if: ${{ !inputs.reset_stage }}
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
          DELIVERY_ARTIFACT: ${{ needs.resolve.outputs.artifact }}
          DELIVERY_DIRECTORY: ${{ runner.temp }}/cf-delivery-${{ github.run_id }}
        run: |
          python3 "$RUNNER_TEMP/fork-release-admission/download_delivery.py" \
            --run-id "$DELIVERY_RUN_ID" --artifact "$DELIVERY_ARTIFACT" \
            --directory "$DELIVERY_DIRECTORY"
      - name: Verify and execute frozen Cloudflare delivery
        if: ${{ !inputs.reset_stage }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          QUALIFICATION_ARTIFACT: ${{ inputs.qualification_artifact }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/cf-delivery-${{ github.run_id }}
          RELEASE_JOURNAL_ROOT: ${{ vars.RELEASE_JOURNAL_ROOT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SECRETS_JSON: ${{ secrets.RELEASE_SECRETS_JSON }}
        run: |
          python3 "$RUNNER_TEMP/fork-release-admission/release_ci.py" verify --directory "$RELEASE_DIRECTORY" \
            --sha "$RELEASE_SHA" --stage "$RELEASE_STAGE" --target cloudflare
          if [ -n "$QUALIFICATION_ARTIFACT" ]; then
            node deploy/cloudflare/scripts/release-cloud-probe.mjs --delivery "$RELEASE_DIRECTORY" \
              --journal-root "$RELEASE_JOURNAL_ROOT"
          else
            node scripts/fork/deploy-cloudflare.mjs --delivery "$RELEASE_DIRECTORY" \
              --journal-root "$RELEASE_JOURNAL_ROOT"
          fi

      # One-time recovery for a stage stuck between the continuation contract
      # (already-published Workers must be byte-identical) and the first-release
      # contract (Workers absent, D1 authorities empty). It is a step of this job,
      # not a job of its own, because the release admission requires this
      # reusable workflow's job names to be exactly the release job set.
      - uses: actions/checkout@v4
        if: ${{ inputs.reset_stage }}
        with:
          persist-credentials: false

      # The names, ids and public hostnames below are the beta stage's, taken from
      # the retained candidate that published them (journal
      # beta-f843a224...-candidate/candidate.json) and from
      # brand/eddy/manifest.yaml; the `web` Worker has no `-cf-` infix. The
      # account comes from the same inventory the release prep reads, so a reset
      # cannot be pointed at another account. All of it is deleted with the
      # one-time reset tool.
      - name: Reset the stage
        if: ${{ inputs.reset_stage }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_INVENTORY: ${{ inputs.stage == 'beta' && vars.CF_INVENTORY_BETA || vars.CF_INVENTORY_PRODUCTION }}
        run: |
          account=$(python3 -c 'import json,os; print(json.loads(os.environ["CF_INVENTORY"])["account_id"])')
          python3 scripts/fork/reset_cloudflare_stage.py \
            --brand eddy --stage "${{ inputs.stage }}" --account "$account" \
            --zone smartipproxy.com \
            --worker eddy-cf-auth-beta \
            --worker eddy-cf-rate-limit-beta \
            --worker eddy-cf-screen-frame-writer-beta \
            --worker eddy-cf-api-core-beta \
            --worker eddy-cf-api-ai-beta \
            --worker eddy-cf-realtime-beta \
            --worker eddy-cf-jobs-beta \
            --worker eddy-cf-edge-beta \
            --worker eddy-web-beta \
            --hostname eddy-cf-beta.smartipproxy.com \
            --hostname eddy-cf-beta-api.smartipproxy.com \
            --hostname eddy-cf-beta-auth.smartipproxy.com \
            --attach eddy-cf-beta.smartipproxy.com=eddy-web-beta \
            --attach eddy-cf-beta-api.smartipproxy.com=eddy-cf-edge-beta \
            --attach eddy-cf-beta-auth.smartipproxy.com=eddy-cf-auth-beta \
            --d1 app=42bbfb33-8d8d-4d66-8fae-c5a3face65e8 \
            --d1 auth=56f2ed9e-d766-4390-ae8f-b50455715753 \
            --confirm "${{ inputs.reset_confirm }}" --apply

      # A failed release must explain itself from the run page. The journals are
      # retained on the host for recovery; this copies the ones that belong to
      # this exact source into the run's evidence. `failure.reason` is written
      # already redacted by the transaction owner, so no credential enters the
      # summary or the artifact.

      - name: Report the retained release journal
        if: failure()
        env:
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_JOURNAL_ROOT: ${{ vars.RELEASE_JOURNAL_ROOT }}
        run: |
          python3 scripts/fork/release_failure_summary.py \
            --target cloudflare --stage "$RELEASE_STAGE" --sha "$RELEASE_SHA" \
            --journal-root "$RELEASE_JOURNAL_ROOT" \
            --evidence-dir "$GITHUB_WORKSPACE/fork-release-evidence" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the release failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-release-failure-${{ needs.resolve.outputs.sha }}
          path: fork-release-evidence
          if-no-files-found: ignore
          retention-days: 30
