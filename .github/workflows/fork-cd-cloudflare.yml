name: Fork CD Cloudflare

on:
  workflow_dispatch:
    inputs:
      delivery_run_id:
        description: Successful Fork Release Preparation run ID
        type: string
        required: true
      stage:
        description: Deployment stage
        type: choice
        options: [beta, production]
        default: beta
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-cd-cloudflare-eddy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'summersmile1984/omi' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, mac-studio, memweft]
    outputs:
      sha: ${{ steps.delivery.outputs.sha }}
      artifact: ${{ steps.delivery.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
          RELEASE_STAGE: ${{ inputs.stage }}
        run: python3 scripts/fork/release_ci.py resolve --run-id "$DELIVERY_RUN_ID" --stage "$RELEASE_STAGE"

  deploy:
    needs: resolve
    environment: cloudflare-${{ inputs.stage }}
    runs-on: [self-hosted, macOS, ARM64, mac-studio, memweft]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/fork-release-tools
      - name: Prepare Cloudflare HTTP contract Python
        run: |
          uvx uv==0.12.3 venv --python 3.14 deploy/cloudflare/python/api-core/.venv
          deploy/cloudflare/python/api-core/.venv/bin/python contracts/deployment/core.py --help
      - name: Download complete frozen delivery
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
          DELIVERY_ARTIFACT: ${{ needs.resolve.outputs.artifact }}
          DELIVERY_DIRECTORY: ${{ runner.temp }}/cf-delivery-${{ github.run_id }}
        run: |
          download_root=$(mktemp -d "$RUNNER_TEMP/eddy-delivery.XXXXXX")
          trap 'rm -rf "$download_root"' EXIT
          for attempt in 1 2 3; do
            attempt_dir="$download_root/$attempt"
            if gh run download "$DELIVERY_RUN_ID" --repo summersmile1984/omi \
              --name "$DELIVERY_ARTIFACT" --dir "$attempt_dir" \
              && test -s "$attempt_dir/delivery.json" \
              && test -s "$attempt_dir/cloudflare.tar.gz" \
              && test -s "$attempt_dir/server-images.tar" \
              && test -s "$attempt_dir/source.tar.gz"; then
              test ! -e "$DELIVERY_DIRECTORY"
              mv "$attempt_dir" "$DELIVERY_DIRECTORY"
              exit 0
            fi
            echo "Artifact download attempt $attempt did not yield a complete delivery" >&2
          done
          echo 'Frozen delivery download failed; deployment has not started' >&2
          exit 1
      - name: Verify and publish frozen Cloudflare release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/cf-delivery-${{ github.run_id }}
          RELEASE_JOURNAL_ROOT: ${{ vars.RELEASE_JOURNAL_ROOT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SECRETS_JSON: ${{ secrets.RELEASE_SECRETS_JSON }}
        run: |
          python3 scripts/fork/release_ci.py verify --directory "$RELEASE_DIRECTORY" \
            --sha "$RELEASE_SHA" --stage "$RELEASE_STAGE" --target cloudflare
          node scripts/fork/deploy-cloudflare.mjs --delivery "$RELEASE_DIRECTORY" \
            --journal-root "$RELEASE_JOURNAL_ROOT"
