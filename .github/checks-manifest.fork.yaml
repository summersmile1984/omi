# Fork-owned deterministic checks.
#
# Same schema as .github/checks-manifest.yaml, kept as a separate file so the
# upstream manifest stays byte-identical and never conflicts on a sync. It is
# executed explicitly:
#
#   .github/scripts/run_checks.py --manifest .github/checks-manifest.fork.yaml --lane <local|ci>
#
# which `scripts/fork/preflight` and `.github/workflows/fork-checks.yml` both do.
# Every entry declares both lanes, as the upstream runner's validator requires.
checks:
  - id: fork-cloudflare-product-core
    command: ["bash", "deploy/cloudflare/ci/product.sh"]
    triggers: ["contracts/deployment/**", "deploy/cloudflare/**", "auth/shared/**", "runtime/shared/**", "backend/models/action_item.py", "backend/models/task_intelligence.py", "web/app/src/lib/**", "web/app/src/types/**"]
    lanes: ["local", "ci"]
    reason: "Actual 2026-09-04 public Tasks input returned CF400 versus Server422, recording was broadcast without a D1 conversation owner, and explicit chat_session_id was ignored by read/write/clear. Execute the common HTTP cases, separate recording/Queue cases and the current Web text-chat consumer through fresh locked workerd, application Workers and normal D1 migrations; the controlled provider supplies inference only, never product state or approval."

  - id: fork-selfhost-product-core
    command: ["bash", "deploy/self-host/ci/product.sh"]
    triggers: ["contracts/deployment/**", "deploy/self-host/**", "deploy/profiles/**", "scripts/profiles/**", ".github/workflows/fork-checks.yml", "backend/fork/**", "backend/firestore_pg/**", "auth-server/**", "auth/shared/**", "runtime/shared/**", "backend/routers/action_items.py", "backend/routers/users.py", "backend/models/action_item.py"]
    lanes: ["local", "ci"]
    reason: "Run shared HTTP product cases through actual Auth/API/PG/Redis/MinIO/Qdrant, fresh migrations and the complete rendered model profile. CI provisions pinned native BGE-M3/Qwen/SenseVoice/Kokoro stores; missing stores or insufficient Docker capacity fail rather than stripping capabilities or substituting fake inference. core names the HTTP case inventory, not a reduced runtime. The self-host fixture owns its own fresh Compose project; its earlier scripted provider fallback and ad-hoc accessibility probe are gone, so a runner without sufficient Docker capacity fails here rather than substituting a fake runtime."
  - id: fork-electron-native-identity
    command: ["bash", "desktop/windows/fork/test.sh"]
    triggers: ["desktop/windows/**", "scripts/profiles/**", "deploy/profiles/**", "scripts/brand/**", "brand/_schema/**", "brand/omi-upstream/**", ".github/workflows/fork-checks.yml"]
    lanes: ["local", "ci"]
    reason: "The audited Electron renderer owned Firebase persistence and pushed caller-supplied identity/base URLs into main. Production owner/IPC/renderer tests and two full staged builds enforce opaque main-only identity; real cold-start blank-window failure and native Origin/HTTP transport incidents are retained as regressions. Packaging, Windows DPAPI/Linux keyring runtime, and live services are separate acceptance."

  - id: fork-selfhost-build-context
    command: ["python3", "deploy/self-host/ci/build_context.py"]
    triggers: ["backend/Dockerfile.dockerignore", "deploy/self-host/Dockerfile.dockerignore", "deploy/self-host/Dockerfile.llm.dockerignore", "deploy/self-host/ci/build_context.py"]
    lanes: ["local", "ci"]
    reason: "Actual 2026-09-04 self-host images copied the 581MB local OpenAPI venv and 110MB test scratch directory; offline scratch Docker builds exercise the actual context filters and preserve each image's intended runtime sources. This uses the builder's matcher instead of another ignore parser."

  - id: fork-flutter-native-identity
    command: ["bash", "app/fork/test.sh"]
    triggers: ["app/fork/**", "app/lib/**", "app/test/fork/**", "app/android/**", "app/pubspec.yaml", "app/pubspec.lock", "scripts/profiles/**", "scripts/brand/raster/**", "deploy/profiles/**", "brand/_schema/**", ".github/workflows/fork-checks.yml"]
    lanes: ["local", "ci"]
    reason: "The audited main stored a dev-issued JWT as a 24-hour mobile login and the generated fork profiles had no startup consumer. Execute the real opaque session owner, staged AuthService/401 behavior and both compiled Dart entrypoints; separately prove native APK/UI locally."

  - id: fork-macos-native-identity
    command: ["bash", "desktop/macos/fork/test.sh"]
    triggers: ["backend/fork/model_contract.py", "desktop/macos/fork/**", "desktop/macos/Desktop/**", "deploy/profiles/**", "scripts/profiles/**", "scripts/brand/**", "brand/_schema/**", "brand/omi-upstream/**", ".github/workflows/fork-checks.yml"]
    lanes: ["local", "ci"]
    platforms: ["macos"]
    reason: "The 2026-09-04 main audit B1 found custom bundles classified as production and sharing upstream storage; exercises staged identity behavior, opaque session/JWT/storage failures and reviewed Swift owner drift. This is a platform consumer contract, not another auth issuer."

  - id: fork-macos-native-compile
    command: ["bash", "desktop/macos/fork/compile.sh"]
    triggers: ["backend/fork/model_contract.py", "desktop/macos/fork/**", "desktop/macos/Desktop/**", "deploy/profiles/**", "scripts/profiles/**", "scripts/brand/**", "brand/_schema/**", "brand/omi-upstream/**", ".github/workflows/fork-checks.yml"]
    lanes: ["local", "ci"]
    platforms: ["macos"]
    reason: "The audit B1 native package replaces complete Swift app owners: leaf tests cannot prove those adapters compile into the real consumer. Execute the same staged debug build locally and on the existing fork CI macOS route; no additional auth policy or release pipeline is introduced."

  - id: fork-overlay-owner-audit
    command: ["bash", "-c", "python3 scripts/fork/test_overlay_owner_audit.py && python3 scripts/fork/check-overlay-owners.py"]
    triggers: ["app/fork/**", "desktop/macos/fork/**", "desktop/windows/fork/**", "app/lib/**", "desktop/macos/Desktop/**", "desktop/windows/**", "scripts/fork/check-overlay-owners.py", "scripts/fork/test_overlay_owner_audit.py", ".github/workflows/fork-checks.yml", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "The v0.12.348 upstream import invalidated eight fork replacement contracts at once (one backend patch binding, two desktop Swift owners, five Flutter file owners). Both client stages verify owners while they build and stop at the first mismatch, so the reviewer paid one slow native/Flutter build per owner and never saw the list. This audits every registry up front and prints all stale owners. It covers the Electron registry and fires on desktop/windows/** because leaving both out reddened fork-electron-native-identity on an upstream change to desktop/windows/package.json alone (the #12753 dev-wrapper line), while five Electron owners were stale at once — one CI round trip each if fixed the way the gate reports them. The Swift half needs xcrun and reports itself skipped elsewhere."
  - id: fork-ci-diff-base
    command: ["bash", "-c", "python3 scripts/fork/test_ci_diff_base.py && python3 scripts/fork/test_release_prepare.py && python3 scripts/fork/test_release_ci.py && python3 scripts/fork/test_deploy_server.py && python3 scripts/fork/test_hosted_core.py && python3 scripts/fork/test_model_services.py && python3 scripts/fork/test_reset_cloudflare_stage.py && python3 scripts/fork/test_run_checks_fan_out.py"]
    triggers: [".github/workflows/fork-*.yml", ".github/actions/fork-release-tools/**", ".github/checks-manifest.fork.yaml", "scripts/fork/**", "deploy/self-host/**", "contracts/deployment/core.py", "contracts/deployment/readiness.json", "backend/fork/tests/**", "backend/tests/**"]
    lanes: ["local", "ci"]
    reason: "The advertised manual Fork Checks entry emitted an empty diff base because workflow_dispatch has no event.before; execute that exact shell in real Git fixtures for PR, push and manual events. This tests the workflow consumer rather than duplicating the shared manifest selector. It also pins the fork gate's own failure reporting: the wrapper fans out one check per invocation so a diff that breaks three checks reports all three, where the upstream runner stops at the first and cost one CI round trip per hidden failure on 2026-09-14 (electron, then repo-state, then the Flutter anchor)."

  - id: fork-workflow-lint
    command: ["python3", "scripts/fork/workflow_lint.py"]
    triggers: [".github/workflows/fork-*.yml", ".github/actions/fork-release-tools/**", ".github/actionlint.fork.yaml", "scripts/fork/workflow_lint.py"]
    lanes: ["local", "ci"]
    reason: "Upstream Repo Checks 34385427248 rejected only the fork's declared Mac Studio labels. Resolve constant fromJSON selectors, then run the same actionlint grammar, shell and runner-label checks with the fork catalog in both lanes; changing the upstream catalog is forbidden."

  - id: fork-deployment-settings
    command: ["bash", "-c", "python3 scripts/fork/test_deployment_settings.py && python3 scripts/fork/check_deployment_settings.py --base \"$1\"", "--", "{base}"]
    triggers: [".github/workflows/fork-*.yml", "config/deployment-setting-classification*.json", "scripts/fork/*deployment_settings.py"]
    lanes: ["local", "ci"]
    reason: "Reuse the existing deployment-secret-boundary checker with the fork's additive name-only classifications; upstream policy and source restrictions remain intact."

  - id: fork-auth-contracts
    command: ["bash", "scripts/fork/auth-contracts.sh"]
    triggers: ["runtime/shared/**", "auth/**", "auth-server/**", "deploy/self-host/auth-runtime.mjs", "contracts/auth/**", "backend/utils/auth_shim.py", "backend/fork/auth_identity.py", "backend/fork/patches/auth.py", "backend/fork/provider_guard.py", "backend/fork/tests/test_auth_identity.py", "backend/fork/tests/test_auth_contract.py", "backend/tests/unit/test_auth_shim.py", "deploy/cloudflare/workers/auth/**", "deploy/cloudflare/tests/auth*.ts", "scripts/fork/auth-contracts.sh"]
    lanes: ["local", "ci"]
    reason: "Shared production claims/session contract catches wrong issuer/audience acceptance shipped in self-host PR #7 and prevents divergent Workers/PG JWT revocation behavior."

  - id: fork-web-build-contracts
    command: ["bash", "deploy/web/ci.sh"]
    triggers: ["backend/fork/model_contract.py", "deploy/profiles/**", "deploy/web/**", "web/app/fork/**", "web/app/src/lib/fork/**", "web/app/src/components/fork/**", "web/app/scripts/copy-moonshine-assets.ts", "web/app/moonshine.config.ts", "scripts/profiles/**", "brand/_schema/**"]
    lanes: ["local", "ci"]
    reason: "the merged deployment scripts still requested removed Next/vinext outputs after upstream switched to Moonshine; a shared source-stage and profile boundary prevents fallback origins and duplicate runtime owners"

  - id: fork-cloudflare-routes
    command: ["bash", "deploy/cloudflare/ci/routes.sh"]
    triggers: ["contracts/deployment/readiness.json", "backend/utils/memory/rejected_memory_feedback.py", "backend/utils/memory/canonical_consolidation.py", "backend/fork/consolidation_admission.py", "backend/fork/tests/fixtures/qwen_duplicate_create.json", "runtime/shared/**", "deploy/cloudflare/**", "backend/main.py", "backend/routers/**", "backend/models/action_item.py", "backend/models/task_intelligence.py", "backend/models/screen_frame.py", "backend/models/frame_request.py", "backend/utils/retrieval/frame_request_policy.py", "backend/utils/retrieval/frame_request_storage.py", "backend/utils/jit_rollout.py", "backend/utils/screen_frames/**", "backend/scripts/export_openapi.py", "backend/scripts/openapi_runner.sh", "backend/openapi-requirements.txt", "backend/database/action_items.py", "backend/database/candidate_integration_outbox.py", "backend/database/candidates.py", "backend/database/conversations.py", "backend/database/document_ids.py", "backend/database/feedback.py", "backend/database/memory_apply_store.py", "backend/database/recurrence_inbox.py", "backend/database/task_recommendations.py", "backend/database/workstreams.py", "backend/jobs/feedback_daily_report.py", "backend/models/feedback.py", "backend/models/knowledge_ledger_policy.py", "backend/models/memories.py", "backend/utils/conversations/overview_markdown.py", "backend/utils/conversations/share_email.py", "backend/utils/feedback_context.py", "backend/utils/llm/chat.py", "backend/utils/llm/prompt_cache.py", "backend/utils/llms/memory.py", "backend/utils/memory/belief_model.py", "backend/utils/memory/canonical_memory_adapter.py", "backend/utils/memory/canonical_required_processing.py", "backend/utils/memory/jit_trigger_contract.py", "backend/utils/memory/jit_trigger_snapshot.py", "backend/utils/memory/knowledge_ledger.py", "backend/utils/memory/ledger_history_policy.py", "backend/utils/memory/memory_api_contract.py", "backend/utils/memory/universal_list_cursor.py", "backend/utils/memory/v3/account_generation_source.py", "backend/utils/notifications.py", "backend/utils/task_intelligence/capture_policy.py", "backend/utils/task_intelligence/live_recommendation_judgment.py", "backend/utils/task_intelligence/recommendations.py", "backend/utils/task_intelligence/staged_migration.py", "backend/utils/memory/belief_source_policy.py", "backend/models/memory_evidence.py"]
    lanes: ["local", "ci"]
    reason: "the merged M2 command invoked a removed upstream export surface, leaving 36 new route identities outside the inventory; exercise real FastAPI registrations and Core/Edge handlers before release. The trigger list also carries every upstream module the Cloudflare stagers project, because a projection whose owner no lane watches can break silently: upstream #12798 added _budget_authority on 2026-09-05, the staged kernel kept calling it, and the NameError sat in main for ten days before reaching an unrelated PR's lane. fork-cloudflare-staged-owners keeps this list complete."

  - id: fork-cloudflare-staged-owners
    command: ["bash", "-c", "p=backend/.venv/bin/python; [ -x \"$p\" ] || p=python3; \"$p\" deploy/cloudflare/scripts/check_staged_owner_coverage.py"]
    triggers: ["deploy/cloudflare/scripts/**", "backend/models/memory_evidence.py", "backend/utils/memory/belief_source_policy.py", "backend/utils/memory/belief_model.py", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "Every upstream module the Cloudflare stagers project must be matched by a fork-cloudflare-* trigger, because a trigger is the only thing that makes a lane rebuild the projection. Upstream #12798 (2026-09-05) added _budget_authority to backend/utils/memory/jit_trigger_snapshot.py; jit_snapshot_sources.py projected the reader but not the helper, so the staged jit_trigger_snapshot_kernel.py called an undefined name, and because that owner was in no Cloudflare trigger no Cloudflare lane ran: the breakage stayed invisible in main for ten days, was first attributed to an unrelated manifest refresh that happened to select the lane, and blocked the next Cloudflare PR instead of the change that caused it. The check is not a shared primitive because the obligation is fork-specific: upstream has no Cloudflare Worker projection, so nothing upstream can express 'this module is staged into a Worker'. It is a static checker, not behavioral coverage; fork-cloudflare-routes builds and exercises the projections."

  - id: fork-web-client-contract
    command: ["bash", "web/app/fork/test.sh"]
    triggers: ["backend/fork/model_contract.py", "web/app/fork/**", "web/app/src/lib/fork/**", "web/app/src/components/fork/**", "web/app/src/hooks/useGeminiLive.ts", "web/app/src/components/home/HomePage.tsx", "scripts/profiles/**", "deploy/profiles/**"]
    lanes: ["local", "ci"]
    reason: "Executes the profile/session/realtime boundary missing from main at the 2026-09-04 audit: fork callers retained Firebase credentials and direct Gemini controls despite their selected capability policy."

  - id: fork-diff-hygiene
    command: ["bash", "-c", "python3 scripts/fork/test_diff_hygiene.py && python3 scripts/fork/check_diff_hygiene.py --changed-files \"$1\" --base \"$2\" --head \"$3\"", "--", "{changed_files}", "{base}", "{head}"]
    triggers: ["all"]
    lanes: ["local", "ci"]
    reason: "Upstream import a41b07f2d1 brought plugin EOF blank lines; formatting them to satisfy upstream diff-hygiene created four forbidden fork edits in 2ed93dbf52. Compare upstream-owned paths with the incorporated upstream ancestor, fork paths with the event base, and scan all changed text for conflict markers. Real Git fixtures also execute the adapted upstream manifest, preserving every other check."

  - id: fork-upstream-touch
    command: ["python3", "scripts/fork/check-upstream-touch.py", "--aggregate"]
    triggers: ["all"]
    lanes: ["local", "ci"]
    reason: "Every upstream file this fork edits is a future merge conflict, and the invariant is a state, not a diff: --aggregate audits the whole divergence against merge-base(HEAD, upstream/main), so a violation that landed in an earlier commit cannot hide. Requires upstream/main to be fetched; a missing ref fails (exit 2) instead of skipping. Exceptions are budgeted in dev/unified-main/upstream-touch-allowlist.yaml."

  - id: fork-upstream-touch-tests
    command: ["python3", "scripts/fork/test_check_upstream_touch.py"]
    triggers: ["scripts/fork/check-upstream-touch.py", "scripts/fork/test_check_upstream_touch.py", "dev/unified-main/upstream-touch-allowlist.yaml"]
    lanes: ["local", "ci"]
    reason: "the guard is only a guard while its own refusals stay covered; its glob matcher already had a bug that let upstream tests through"

  - id: fork-upstream-sync-plan-tests
    command: ["python3", "scripts/fork/test_upstream_sync_plan.py"]
    triggers: ["scripts/fork/upstream_sync_plan.py", "scripts/fork/test_upstream_sync_plan.py", ".github/workflows/fork-upstream-sync.yml"]
    lanes: ["local", "ci"]
    reason: "A weekly sync must measure its real merge conflicts without altering main or reusing rerere; a clean import must be able to open one regular merge PR, while a conflict must stop before any branch is pushed."

  - id: fork-release-failure-tests
    command: ["python3", "scripts/fork/test_release_failure_summary.py"]
    triggers: ["scripts/fork/release_failure_summary.py", "scripts/fork/test_release_failure_summary.py", ".github/workflows/fork-cd-cloudflare.yml", ".github/workflows/fork-cd-server.yml"]
    lanes: ["local", "ci"]
    reason: "The 2026-09-10 beta Cloudflare CD run uploaded all nine Workers and then failed readiness, leaving only 'release did not pass readiness; inspect recovery plan' plus a host path; the root cause had to be reconstructed by hand. The failure step runs on an already-failing job, so it must find only the admitted source's journals, survive a missing or malformed one, and exit 0."

  - id: fork-repo-state
    command: ["python3", "scripts/fork/check_repo_state.py"]
    triggers: ["all"]
    lanes: ["local", "ci"]
    reason: "Which upstream workflows are enabled, which checks gate main, and how the deployment environments are protected live only in GitHub's settings. Nothing in the tree recorded them, so a weekly sync could land new upstream workflows enabled and only somebody remembering `gh workflow disable` corrected it; the 2026-09-10 sync did exactly that for four gcp_* files by hand. The policy declares all three; the static lane checks the tree, the live lane (GITHUB_ACTIONS) compares the registered workflow states, and `apply_repo_state.py --plan-only` lets a CI lane without an administration credential still produce a deterministic plan; the actual `--verify` reconciliation is operator-owned because it requires a credential a GITHUB_TOKEN does not carry."

  - id: fork-repo-state-tests
    command: ["bash", "-c", "python3 scripts/fork/test_check_repo_state.py && python3 scripts/fork/test_apply_repo_state.py"]
    triggers: ["scripts/fork/check_repo_state.py", "scripts/fork/apply_repo_state.py", "scripts/fork/test_check_repo_state.py", "scripts/fork/test_apply_repo_state.py", "config/repo-state.fork.json"]
    lanes: ["local", "ci"]
    reason: "The declaration is only worth having while its refusals hold: an unclassified workflow, a required job that is not a literal job name in its own workflow, a quarantine entry that still gates main, an untracked deferral, and a deploy path naming a different brand must each fail."

  - id: fork-profile-tables
    command: ["python3", "scripts/profiles/check_tables.py"]
    triggers: ["backend/fork/model_contract.py", "deploy/profiles/**", "scripts/profiles/**", "brand/**", "scripts/brand/**", "app/lib/env/environment_profile.dart", "app/lib/env/fork/**", "desktop/macos/Desktop/Sources/Generated/**", "desktop/windows/src/shared/fork/**", "web/app/src/lib/fork/**", "backend/fork/deployment_profiles.generated.json"]
    lanes: ["local", "ci"]
    reason: "one profile source drives four platforms; omi_cloud must still reproduce upstream's environment_profile.dart literals, so upstream retuning them fails here on the next sync instead of drifting silently"

  - id: fork-backend-seams
    command: ["bash", "-c", "cd backend && printf '%s\\n' fork/tests/test_patch_registry.py fork/tests/test_real_seams.py fork/tests/test_profile_selection.py > /tmp/omi-fork-seams.txt && BACKEND_UNIT_TEST_FILE_LIST=/tmp/omi-fork-seams.txt bash test.sh"]
    triggers: ["backend/fork/**", "backend/utils/other/storage.py", "backend/utils/cloud_tasks.py", "deploy/profiles/**"]
    lanes: ["local", "ci"]
    reason: "the fork patches upstream symbols instead of editing them, so an upstream rename must fail here by name rather than leave a self-hosted deployment calling a cloud it cannot reach"

  - id: fork-brand-tooling-tests
    command: ["python3", "scripts/brand/test_brand_tooling.py"]
    triggers: ["brand/**", "scripts/brand/**", "omi/firmware/fork/**"]
    lanes: ["local", "ci"]
    reason: "apply.py/check.py are the enforcement path for the trademark boundary between brands; a bug here is a leak or a false negative, not a cosmetic failure"

  - id: fork-brand-raster
    command: ["npm", "test", "--prefix", "scripts/brand/raster"]
    triggers: ["scripts/brand/raster/**"]
    lanes: ["local", "ci"]
    reason: "The Electron white-label asset package originally owned the only PNG validator and fixture, leaving macOS and Flutter to diverge or retain copied Omi rasters. Exercise the shared bounded decoder and resize failure boundary before any platform generator consumes it."

  - id: fork-brand-upstream-clean
    command: ["python3", "scripts/brand/check.py", "--brand", "omi-upstream"]
    triggers: ["brand/**", "scripts/brand/**"]
    lanes: ["local", "ci"]
    reason: "apply.py --brand omi-upstream must stay a zero-diff no-op as generators land in B1-B7 -- this is the regression guarantee the design doc's B0 acceptance criteria names"

  - id: fork-profile-boundary-tests
    command: ["python3", "scripts/profiles/test_profiles.py"]
    triggers: ["backend/fork/model_contract.py", "deploy/profiles/**", "scripts/profiles/**", "brand/**", "scripts/brand/**"]
    lanes: ["local", "ci"]
    reason: "2026-09-04 main audit E2 reproduced a schema-valid brand generating blank objects URLs and implicit auth routing; both target fixtures must exercise the same production renderer and all five output checks"

  - id: fork-selfhost-startup
    command: ["bash", "-c", "cd backend && tests=$(mktemp) && trap 'rm -f \"$tests\"' EXIT && printf '%s\\n' fork/tests/test_startup_contract.py fork/tests/test_memory_maintenance_worker.py fork/tests/test_conversation_search.py fork/tests/test_consolidation_admission.py fork/tests/test_canonical_mutations.py fork/tests/test_memory_operation_clock.py fork/tests/test_finalization_queue.py fork/tests/test_queue_retries.py fork/tests/test_selfhost_config.py fork/tests/test_auth_consumers.py fork/tests/test_account_deletion.py fork/tests/test_vector_qdrant.py fork/tests/test_embedding.py fork/tests/test_local_llm.py fork/tests/test_model_tools.py fork/tests/test_speech_contract.py fork/tests/test_speech_transport.py fork/tests/test_hosted_speech.py fork/tests/test_operator_ai.py fork/tests/test_disabled_capabilities.py fork/tests/test_minio_contract.py fork/tests/test_firmware.py fork/tests/test_storage_queue_adapters.py fork/tests/test_provider_guard.py fork/tests/test_pg_write_policy.py fork/tests/test_pg_owner_inventory.py fork/tests/test_pg_nested_transforms.py > \"$tests\" && BACKEND_UNIT_TEST_FILE_LIST=\"$tests\" bash test.sh"]
    triggers: ["backend/fork/tests/test_storage_queue_adapters.py", "deploy/self-host/**", "backend/fork/**", "backend/requirements-fork.txt", "backend/utils/memory/canonical_memory_adapter.py", "backend/firestore_pg/**", "backend/utils/sensevoice/**", "backend/utils/cloud_tasks_redis.py", "backend/utils/cloud_tasks.py", "backend/utils/auth_shim.py", "backend/utils/other/endpoints.py", "backend/database/users.py", "backend/database/account_deletion_transitions.py", "backend/database/legal_holds.py", "backend/database/vector_db.py", "backend/utils/other/storage.py", "backend/Dockerfile", "backend/Dockerfile.dockerignore", "deploy/profiles/**", "scripts/profiles/**"]
    lanes: ["local", "ci"]
    reason: "fork PR #7 shipped a missing PG migration command and an ungenerated profile; prove source closure and fatal process admission through the real entrypoints; the same main audit reproduced PG deletion gaps, now guarded by transactional erasure/receipt behaviors"

  - id: fork-local-dev-harness
    command: ["bash", "-c", "python3 dev/tests/test_local_sh.py && python3 dev/tests/test_selfhost_local_sh.py && python3 dev/tests/test_git_hygiene.py"]
    triggers: ["dev/**", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "The 2026-09-15 cold start found two blind spots in dev/selfhost-local.sh: `stop` only knew the pid file, so a backend left listening without one kept :8100 taken while `stop` reported success, and `status` called that same live backend stopped. `make -f Makefile.fork local-selftest` already covered dev/local.sh, but no lane ran it -- both the existing suite and these regressions were on-demand only. This runs both hermetically: no docker, no backend, loopback sockets only."

  - id: fork-backend-test-collection
    command: ["bash", "-c", "cd backend && p=.venv/bin/python; [ -x \"$p\" ] || p=python3; \"$p\" -m pytest fork/tests --collect-only -q"]
    triggers: ["backend/fork/tests/**", "backend/fork/**", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "Every backend fork lane runs a hand-written file list (fork-backend-seams names three files, fork-selfhost-startup names twenty-six), so a test file that nothing lists is executed by nobody and rots unseen. The 2026-09-04 audit recorded exactly that: backend/fork/tests/test_export_cloudflare_x_posts.py imported scripts.export_cloudflare_x_posts, a module that never existed in this repository, and its collection error stayed invisible for eleven days because both lanes hand-list their files. Importing every test module costs about two seconds and catches that class without running the suite; a full-directory execution is deliberately not used here, because two of its files interfere with each other's environment (recorded in dev/ci-cd-three-stages.md)."

  - id: fork-hosted-operator-smoke
    command: ["bash", "-c", "cd backend && p=.venv/bin/python; [ -x \"$p\" ] || p=python3; \"$p\" ../deploy/self-host/hosted-live-smoke.py --self-check"]
    triggers: ["backend/fork/**", "backend/fork/tests/**", "deploy/self-host/**", "deploy/profiles/**", "scripts/profiles/**", "brand/_schema/**"]
    lanes: ["local", "ci"]
    reason: "The hosted operator vendors are selected only at render time, so a wire-shape drift in their OpenAI-compatible clients (chat, bge-m3 embeddings with the 1024-dimension invariant, multipart ASR, TTS with the WAV envelope) would otherwise be caught only by a live deployment with real credentials. The self-check runs the exact same call builders against controlled fake transports with no network; the real per-vendor four-call probe stays a documented live operation."

  - id: fork-local-dev-harness-e2e
    command: ["bash", "-c", "set -e; p=backend/.venv/bin/python; [ -x \"$p\" ] || p=python3; \"$p\" scripts/fork/test_run_e2e.py; \"$p\" scripts/fork/run_e2e.py -q --tb=line"]
    triggers: ["scripts/fork/run_e2e.py", "scripts/fork/test_run_e2e.py", "backend/testing/e2e/**", "backend/requirements.txt", "backend/pylock*.toml", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "CI passed flags to run_e2e.py and silently dropped testing/e2e/, broadening collection to unrelated tests. Run the unchanged upstream suite with an explicit path and clean environment; its own conftest owns fake services and outbound-network blocking. This is hermetic API behavior, not proof of local Compose or container readiness."

  - id: fork-container-contracts
    command: ["python3", "scripts/fork/run-container-tests.py"]
    triggers: ["scripts/fork/run-container-tests.py", "dev/requirements-test.*", "dev/pytest-containers.ini", "dev/tests/containers/**", "backend/firestore_pg/**", "backend/database/redis_db.py", "backend/pylock*.toml", "backend/.python-version", "backend/scripts/sync-python-deps.sh", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "Backend unit CI 35382509859 failed during collection because the replaced upstream conftest imported unprovisioned Testcontainers. Execute scoped Redis and existing PG shadow scenarios in a separately locked fork test environment, never the upstream unit conftest or production dependency layer. Docker and image provisioning are required; real-SDK emulator parity remains a separate opt-in."

  - id: fork-repo-state-apply
    command: ["python3", "scripts/fork/apply_repo_state.py", "--plan-only"]
    triggers: ["config/repo-state.fork.json", "scripts/fork/apply_repo_state.py", "scripts/fork/test_apply_repo_state.py", "scripts/fork/check_repo_state.py", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "fork-repo-state proves the declaration against the tree and (in live mode) the registered workflows, but the ruleset and environment protections need an administration credential a GITHUB_TOKEN cannot carry; that half has only ever been operator-owned. Without a CI lane exercising the planner, a refactor of apply_repo_state.py can pass the unit tests and still leave the planner broken when an operator runs --apply, and the next sync would land a fork-main-gate that the operator cannot reconcile. --plan-only reads the declaration and never contacts GitHub, so it stays green in any lane; the actual --verify reconciliation remains operator-owned and continues to be the only way the ruleset and environment halves are confirmed."

  - id: fork-staged-targets
    command: ["bash", "-c", "p=backend/.venv/bin/python; [ -x \"$p\" ] || p=python3; bash deploy/cloudflare/ci/product.sh --help 2>&1 | head -1; bash deploy/self-host/ci/product.sh --help 2>&1 | head -1; node deploy/cloudflare/contracts/local-target.mjs --help 2>&1 | head -1; \"$p\" deploy/self-host/ci/product.py --help 2>&1 | grep -E 'stage|self-test|brand-id'"]
    triggers: ["deploy/cloudflare/ci/product.sh", "deploy/self-host/ci/product.sh", "deploy/cloudflare/contracts/local-target.mjs", "deploy/self-host/ci/product.py", ".github/checks-manifest.fork.yaml"]
    lanes: ["local", "ci"]
    reason: "contracts/deployment/README.md promises stage-aware ready paths (boot/public for Server, frozen/local + frozen/private for Cloudflare), but neither deploy/cloudflare/ci/product.sh nor deploy/self-host/ci/product.sh currently expose a --stage argument; local-target.mjs and product.py do. This check is a thin tripwire: any future PR that adds or removes a stage/brand/flag in one of these four entry points surfaces here before the contracts/deployment docs lie about it. It does not exercise the runtime, only the entry-point argument parser."
