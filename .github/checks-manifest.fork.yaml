# Fork-owned deterministic checks.
#
# Same schema as .github/checks-manifest.yaml, kept as a separate file so the
# upstream manifest stays byte-identical and never conflicts on a sync. It is
# executed explicitly:
#
#   .github/scripts/run_checks.py --manifest .github/checks-manifest.fork.yaml --lane <local|ci>
#
# which `scripts/fork/preflight` and `.github/workflows/fork-checks.yml` both do.
# Every entry declares both lanes, as the upstream runner's validator requires.
checks:
  - id: fork-upstream-touch
    command: ["python3", "scripts/fork/check-upstream-touch.py", "--base", "{base}"]
    triggers: ["all"]
    lanes: ["local", "ci"]
    reason: "every upstream file this fork edits is a future merge conflict; the default is zero and exceptions are budgeted in dev/unified-main/upstream-touch-allowlist.yaml"

  - id: fork-upstream-touch-tests
    command: ["python3", "scripts/fork/test_check_upstream_touch.py"]
    triggers: ["scripts/fork/check-upstream-touch.py", "scripts/fork/test_check_upstream_touch.py", "dev/unified-main/upstream-touch-allowlist.yaml"]
    lanes: ["local", "ci"]
    reason: "the guard is only a guard while its own refusals stay covered; its glob matcher already had a bug that let upstream tests through"

  - id: fork-profile-tables
    command: ["python3", "scripts/profiles/check_tables.py"]
    triggers: ["deploy/profiles/**", "scripts/profiles/**", "app/lib/env/environment_profile.dart", "app/lib/env/fork/**", "desktop/macos/Desktop/Sources/Generated/**", "desktop/windows/src/shared/fork/**", "web/app/src/lib/fork/**", "backend/fork/deployment_profiles.generated.json"]
    lanes: ["local", "ci"]
    reason: "one profile source drives four platforms; omi_cloud must still reproduce upstream's environment_profile.dart literals, so upstream retuning them fails here on the next sync instead of drifting silently"

  - id: fork-backend-seams
    command: ["bash", "-c", "cd backend && printf '%s\\n' fork/tests/test_patch_registry.py fork/tests/test_real_seams.py fork/tests/test_profile_selection.py > /tmp/omi-fork-seams.txt && BACKEND_UNIT_TEST_FILE_LIST=/tmp/omi-fork-seams.txt bash test.sh"]
    triggers: ["backend/fork/**", "backend/utils/other/storage.py", "backend/utils/cloud_tasks.py", "deploy/profiles/**"]
    lanes: ["local", "ci"]
    reason: "the fork patches upstream symbols instead of editing them, so an upstream rename must fail here by name rather than leave a self-hosted deployment calling a cloud it cannot reach"

  - id: fork-brand-tooling-tests
    command: ["python3", "scripts/brand/test_brand_tooling.py"]
    triggers: ["brand/**", "scripts/brand/**"]
    lanes: ["local", "ci"]
    reason: "apply.py/check.py are the enforcement path for the trademark boundary between brands; a bug here is a leak or a false negative, not a cosmetic failure"

  - id: fork-brand-upstream-clean
    command: ["python3", "scripts/brand/check.py", "--brand", "omi-upstream"]
    triggers: ["brand/**", "scripts/brand/**"]
    lanes: ["local", "ci"]
    reason: "apply.py --brand omi-upstream must stay a zero-diff no-op as generators land in B1-B7 -- this is the regression guarantee the design doc's B0 acceptance criteria names"
