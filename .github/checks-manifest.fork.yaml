# Fork-owned deterministic checks.
#
# Same schema as .github/checks-manifest.yaml, kept as a separate file so the
# upstream manifest stays byte-identical and never conflicts on a sync. It is
# executed explicitly:
#
#   .github/scripts/run_checks.py --manifest .github/checks-manifest.fork.yaml --lane <local|ci>
#
# which `scripts/fork/preflight` and `.github/workflows/fork-checks.yml` both do.
# Every entry declares both lanes, as the upstream runner's validator requires.
checks:
  - id: fork-selfhost-product-core
    command: ["bash", "deploy/self-host/ci/product.sh"]
    triggers: ["contracts/deployment/**", "deploy/self-host/**", "backend/fork/**", "backend/firestore_pg/**", "auth-server/**", "auth/shared/**", "runtime/shared/**", "backend/routers/action_items.py", "backend/routers/users.py", "backend/models/action_item.py"]
    lanes: ["local", "ci"]
    reason: "The 2026-09-04 real Android onboarding request failed on the missing dynamic PG owner, while the same invalid task body returned Server422/CF400. Run shared HTTP product cases through actual Auth/API/PG/Redis/MinIO/Qdrant and fresh migrations; this tests existing product owners instead of adding another state or validation primitive."

  - id: fork-selfhost-build-context
    command: ["python3", "deploy/self-host/ci/build_context.py"]
    triggers: ["backend/Dockerfile.dockerignore", "deploy/self-host/Dockerfile.dockerignore", "deploy/self-host/ci/build_context.py"]
    lanes: ["local", "ci"]
    reason: "Actual 2026-09-04 self-host images copied the 581MB local OpenAPI venv and 110MB test scratch directory; an offline scratch Docker build exercises both real context filters and preserves runtime sources. This uses the builder's matcher instead of another ignore parser."

  - id: fork-flutter-native-identity
    command: ["bash", "app/fork/test.sh"]
    triggers: ["app/fork/**", "app/lib/**", "app/test/fork/**", "app/android/**", "app/pubspec.yaml", "app/pubspec.lock", "scripts/profiles/**", "deploy/profiles/**", "brand/_schema/**", ".github/workflows/fork-checks.yml"]
    lanes: ["local", "ci"]
    reason: "The audited main stored a dev-issued JWT as a 24-hour mobile login and the generated fork profiles had no startup consumer. Execute the real opaque session owner, staged AuthService/401 behavior and both compiled Dart entrypoints; separately prove native APK/UI locally."

  - id: fork-macos-native-identity
    command: ["bash", "desktop/macos/fork/test.sh"]
    triggers: ["backend/fork/model_contract.py", "desktop/macos/fork/**", "desktop/macos/Desktop/**", "deploy/profiles/**", "scripts/profiles/**", "scripts/brand/**", "brand/_schema/**", "brand/omi-upstream/**", ".github/workflows/fork-checks.yml"]
    lanes: ["local", "ci"]
    platforms: ["macos"]
    reason: "The 2026-09-04 main audit B1 found custom bundles classified as production and sharing upstream storage; exercises staged identity behavior, opaque session/JWT/storage failures and reviewed Swift owner drift. This is a platform consumer contract, not another auth issuer."

  - id: fork-macos-native-compile
    command: ["bash", "desktop/macos/fork/compile.sh"]
    triggers: ["backend/fork/model_contract.py", "desktop/macos/fork/**", "desktop/macos/Desktop/**", "deploy/profiles/**", "scripts/profiles/**", "scripts/brand/**", "brand/_schema/**", "brand/omi-upstream/**", ".github/workflows/fork-checks.yml"]
    lanes: ["local", "ci"]
    platforms: ["macos"]
    reason: "The audit B1 native package replaces complete Swift app owners: leaf tests cannot prove those adapters compile into the real consumer. Execute the same staged debug build locally and on the existing fork CI macOS route; no additional auth policy or release pipeline is introduced."

  - id: fork-ci-diff-base
    command: ["python3", "scripts/fork/test_ci_diff_base.py"]
    triggers: [".github/workflows/fork-checks.yml", "scripts/fork/test_ci_diff_base.py"]
    lanes: ["local", "ci"]
    reason: "The advertised manual Fork Checks entry emitted an empty diff base because workflow_dispatch has no event.before; execute that exact shell in real Git fixtures for PR, push and manual events. This tests the workflow consumer rather than duplicating the shared manifest selector."

  - id: fork-auth-contracts
    command: ["bash", "scripts/fork/auth-contracts.sh"]
    triggers: ["runtime/shared/**", "auth/**", "auth-server/**", "deploy/self-host/auth-runtime.mjs", "contracts/auth/**", "backend/utils/auth_shim.py", "backend/fork/auth_identity.py", "backend/fork/patches/auth.py", "backend/fork/provider_guard.py", "backend/fork/tests/test_auth_identity.py", "backend/fork/tests/test_auth_contract.py", "backend/tests/unit/test_auth_shim.py", "deploy/cloudflare/workers/auth/**", "deploy/cloudflare/tests/auth*.ts", "scripts/fork/auth-contracts.sh"]
    lanes: ["local", "ci"]
    reason: "Shared production claims/session contract catches wrong issuer/audience acceptance shipped in self-host PR #7 and prevents divergent Workers/PG JWT revocation behavior."

  - id: fork-web-build-contracts
    command: ["bash", "deploy/web/ci.sh"]
    triggers: ["backend/fork/model_contract.py", "deploy/profiles/**", "deploy/web/**", "web/app/fork/**", "web/app/src/lib/fork/**", "web/app/src/components/fork/**", "web/app/scripts/copy-moonshine-assets.ts", "web/app/moonshine.config.ts", "scripts/profiles/**", "brand/_schema/**"]
    lanes: ["local", "ci"]
    reason: "the merged deployment scripts still requested removed Next/vinext outputs after upstream switched to Moonshine; a shared source-stage and profile boundary prevents fallback origins and duplicate runtime owners"

  - id: fork-cloudflare-routes
    command: ["bash", "deploy/cloudflare/ci/routes.sh"]
    triggers: ["runtime/shared/**", "deploy/cloudflare/**", "backend/main.py", "backend/routers/**", "backend/models/action_item.py", "backend/models/task_intelligence.py", "backend/scripts/export_openapi.py", "backend/scripts/openapi_runner.sh", "backend/openapi-requirements.txt"]
    lanes: ["local", "ci"]
    reason: "the merged M2 command invoked a removed upstream export surface, leaving 36 new route identities outside the inventory; exercise real FastAPI registrations and Core/Edge handlers before release"

  - id: fork-web-client-contract
    command: ["bash", "web/app/fork/test.sh"]
    triggers: ["backend/fork/model_contract.py", "web/app/fork/**", "web/app/src/lib/fork/**", "web/app/src/components/fork/**", "web/app/src/hooks/useGeminiLive.ts", "web/app/src/components/home/HomePage.tsx", "scripts/profiles/**", "deploy/profiles/**"]
    lanes: ["local", "ci"]
    reason: "Executes the profile/session/realtime boundary missing from main at the 2026-09-04 audit: fork callers retained Firebase credentials and direct Gemini controls despite their selected capability policy."

  - id: fork-upstream-touch
    command: ["python3", "scripts/fork/check-upstream-touch.py", "--base", "{base}"]
    triggers: ["all"]
    lanes: ["local", "ci"]
    reason: "every upstream file this fork edits is a future merge conflict; the default is zero and exceptions are budgeted in dev/unified-main/upstream-touch-allowlist.yaml"

  - id: fork-upstream-touch-tests
    command: ["python3", "scripts/fork/test_check_upstream_touch.py"]
    triggers: ["scripts/fork/check-upstream-touch.py", "scripts/fork/test_check_upstream_touch.py", "dev/unified-main/upstream-touch-allowlist.yaml"]
    lanes: ["local", "ci"]
    reason: "the guard is only a guard while its own refusals stay covered; its glob matcher already had a bug that let upstream tests through"

  - id: fork-profile-tables
    command: ["python3", "scripts/profiles/check_tables.py"]
    triggers: ["backend/fork/model_contract.py", "deploy/profiles/**", "scripts/profiles/**", "brand/**", "scripts/brand/**", "app/lib/env/environment_profile.dart", "app/lib/env/fork/**", "desktop/macos/Desktop/Sources/Generated/**", "desktop/windows/src/shared/fork/**", "web/app/src/lib/fork/**", "backend/fork/deployment_profiles.generated.json"]
    lanes: ["local", "ci"]
    reason: "one profile source drives four platforms; omi_cloud must still reproduce upstream's environment_profile.dart literals, so upstream retuning them fails here on the next sync instead of drifting silently"

  - id: fork-backend-seams
    command: ["bash", "-c", "cd backend && printf '%s\\n' fork/tests/test_patch_registry.py fork/tests/test_real_seams.py fork/tests/test_profile_selection.py > /tmp/omi-fork-seams.txt && BACKEND_UNIT_TEST_FILE_LIST=/tmp/omi-fork-seams.txt bash test.sh"]
    triggers: ["backend/fork/**", "backend/utils/other/storage.py", "backend/utils/cloud_tasks.py", "deploy/profiles/**"]
    lanes: ["local", "ci"]
    reason: "the fork patches upstream symbols instead of editing them, so an upstream rename must fail here by name rather than leave a self-hosted deployment calling a cloud it cannot reach"

  - id: fork-brand-tooling-tests
    command: ["python3", "scripts/brand/test_brand_tooling.py"]
    triggers: ["brand/**", "scripts/brand/**"]
    lanes: ["local", "ci"]
    reason: "apply.py/check.py are the enforcement path for the trademark boundary between brands; a bug here is a leak or a false negative, not a cosmetic failure"

  - id: fork-brand-upstream-clean
    command: ["python3", "scripts/brand/check.py", "--brand", "omi-upstream"]
    triggers: ["brand/**", "scripts/brand/**"]
    lanes: ["local", "ci"]
    reason: "apply.py --brand omi-upstream must stay a zero-diff no-op as generators land in B1-B7 -- this is the regression guarantee the design doc's B0 acceptance criteria names"

  - id: fork-profile-boundary-tests
    command: ["python3", "scripts/profiles/test_profiles.py"]
    triggers: ["backend/fork/model_contract.py", "deploy/profiles/**", "scripts/profiles/**", "brand/**", "scripts/brand/**"]
    lanes: ["local", "ci"]
    reason: "2026-09-04 main audit E2 reproduced a schema-valid brand generating blank objects URLs and implicit auth routing; both target fixtures must exercise the same production renderer and all five output checks"

  - id: fork-selfhost-startup
    command: ["bash", "-c", "cd backend && tests=$(mktemp) && trap 'rm -f \"$tests\"' EXIT && printf '%s\\n' fork/tests/test_startup_contract.py fork/tests/test_selfhost_config.py fork/tests/test_auth_consumers.py fork/tests/test_account_deletion.py fork/tests/test_vector_qdrant.py fork/tests/test_embedding.py fork/tests/test_speech_contract.py fork/tests/test_speech_transport.py fork/tests/test_disabled_capabilities.py fork/tests/test_minio_contract.py tests/unit/test_cloud_neutral_storage_and_queue.py fork/tests/test_provider_guard.py fork/tests/test_pg_write_policy.py fork/tests/test_pg_owner_inventory.py > \"$tests\" && BACKEND_UNIT_TEST_FILE_LIST=\"$tests\" bash test.sh"]
    triggers: ["backend/tests/unit/test_cloud_neutral_storage_and_queue.py", "deploy/self-host/**", "backend/fork/**", "backend/firestore_pg/**", "backend/utils/sensevoice/**", "backend/utils/cloud_tasks_redis.py", "backend/utils/cloud_tasks.py", "backend/utils/auth_shim.py", "backend/utils/other/endpoints.py", "backend/database/users.py", "backend/database/account_deletion_transitions.py", "backend/database/legal_holds.py", "backend/database/vector_db.py", "backend/utils/other/storage.py", "backend/Dockerfile", "backend/Dockerfile.dockerignore", "deploy/profiles/**", "scripts/profiles/**"]
    lanes: ["local", "ci"]
    reason: "fork PR #7 shipped a missing PG migration command and an ungenerated profile; prove source closure and fatal process admission through the real entrypoints; the same main audit reproduced PG deletion gaps, now guarded by transactional erasure/receipt behaviors"
