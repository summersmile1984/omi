name: Fork release tools
description: Install the locked toolchain for frozen deployment artifacts
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
      with:
        enable-cache: true
        cache-dependency-glob: backend/pylock*.toml
    - name: Backend tools
      shell: bash
      run: |
        uv python install 3.12
        fork_python=$(uv python find --managed-python 3.12)
        export PATH="$(dirname "$fork_python"):$PATH"
        make setup-backend
        uv pip install --python backend/.venv/bin/python --no-deps --require-hashes -r backend/requirements-fork.txt
        echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          auth-server/package-lock.json
          deploy/cloudflare/package-lock.json
          scripts/brand/raster/package-lock.json
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Locked dependencies
      shell: bash
      run: |
        npm ci --prefix auth-server --ignore-scripts --no-audit --no-fund
        npm ci --prefix deploy/cloudflare --ignore-scripts --no-audit --no-fund
        npm ci --prefix scripts/brand/raster --ignore-scripts --no-audit --no-fund
        (cd web/app && bun install --frozen-lockfile)
