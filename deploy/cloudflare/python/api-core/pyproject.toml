[project]
name = "omi-cf-api-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.121.0",
  "pytz==2024.1",
  "tzdata==2024.1",
  "pillow==11.3.0",
  "python-multipart==0.0.31",
]

[dependency-groups]
dev = [
  "httpx",
  "workers-py",
  "workers-runtime-sdk",
  "pytest",
  # The Worker suite is the slow half of the fork gate (~17:45 in CI). It is
  # file-isolated, so `--dist loadfile` shards it safely: 1299 tests in 2:50 on a
  # developer machine that took 10:34 single-process.
  "pytest-xdist",
]
