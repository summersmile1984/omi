version: 1
routes:
  - method: GET
    path: /health
    owner: edge
    runtime: edge-worker
    target_runtime: typescript-worker
    auth_authority: public
    protocol: http
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: ANY
    path: /api/auth/*
    owner: auth
    runtime: auth-worker
    target_runtime: typescript-worker
    auth_authority: better-auth
    dependencies: [d1-auth]
    protocol: http
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: POST
    path: /v1/embeddings
    owner: api-ai
    runtime: python-worker
    target_runtime: external-api
    auth_authority: better-auth
    dependencies: [external-embedding-api]
    protocol: http
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: ANY
    path: /v1/ai/*
    owner: api-ai
    runtime: python-worker
    target_runtime: external-api
    auth_authority: better-auth
    dependencies: [external-ai-api]
    protocol: http
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: POST
    path: /v1/stt/transcribe
    owner: api-ai
    runtime: python-worker
    target_runtime: external-api
    auth_authority: better-auth
    dependencies: [external-asr-api]
    protocol: http
    idempotency: optional
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: ANY
    path: /v2/voice-message/transcribe-stream
    owner: realtime
    runtime: realtime-do
    target_runtime: realtime-do
    auth_authority: better-auth
    dependencies: [durable-object, external-asr-api]
    protocol: websocket
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: ANY
    path: /v4/listen
    owner: realtime
    runtime: realtime-do
    target_runtime: realtime-do
    auth_authority: better-auth
    dependencies: [durable-object, external-asr-api]
    protocol: websocket
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: ANY
    path: /v4/web/listen
    owner: realtime
    runtime: realtime-do
    target_runtime: realtime-do
    auth_authority: better-auth
    dependencies: [durable-object, external-asr-api]
    protocol: websocket
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: ANY
    path: /v1/omni/relay
    owner: realtime
    runtime: realtime-do
    target_runtime: realtime-do
    auth_authority: better-auth
    dependencies: [durable-object, external-asr-api]
    protocol: websocket
    rollout: staging-only
    rollback: edge-route-to-legacy
  - method: ANY
    path: /v1/*
    owner: api-core
    runtime: python-worker
    target_runtime: python-worker
    auth_authority: better-auth
    dependencies: [d1-app, r2]
    protocol: http
    rollout: staging-only
    rollback: edge-route-to-legacy
