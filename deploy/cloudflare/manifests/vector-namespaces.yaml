version: 1
sources:
  - backend/database/vector_db.py
  - backend/database/memory_vector_repair_pinecone_adapter.py
policy:
  vectorize_is_authoritative: false
  candidate_ids_must_be_hydrated: true
  max_vectorize_dimensions: 1536
# source_model/source_dimensions describe historical namespaces only. The
# staging target re-embeds with the Cloudflare Workers AI target_model and does
# not call the historical OpenAI/Gemini providers.
namespaces:
  - id: conversations
    legacy_namespace: ns1
    authoritative_source: conversation-repository
    source_model: openai/text-embedding-3-large
    source_dimensions: 3072
    target: vectorize
    target_index: omi-cf-conversations-v2
    target_model: "@cf/baai/bge-m3"
    target_dimensions: 1024
    migration_mode: reembed
    migration_state: staging-owned
    candidate_only: true
  - id: memories
    legacy_namespace: ns2
    authoritative_source: memory-repository
    source_model: openai/text-embedding-3-large
    source_dimensions: 3072
    target: vectorize
    target_index: omi-cf-memories-v2
    target_model: "@cf/baai/bge-m3"
    target_dimensions: 1024
    migration_mode: reembed
    migration_state: staging-owned
    candidate_only: true
  - id: workstream-associations
    # Reembedded on the shared multilingual model (product text is not
    # English-only) so the single-model projection/query path stays intact.
    legacy_namespace: workstream-association-v1
    authoritative_source: workstream-repository
    source_model: openai/text-embedding-3-large
    source_dimensions: 3072
    target: vectorize
    target_index: omi-cf-workstreams-v1
    target_model: "@cf/baai/bge-m3"
    target_dimensions: 1024
    migration_mode: reembed
    migration_state: staging-owned
    candidate_only: true
  - id: x-posts
    legacy_namespace: ns_x
    authoritative_source: x-post-repository
    source_model: openai/text-embedding-3-large
    source_dimensions: 3072
    target: vectorize
    target_index: omi-cf-x-posts-v2
    target_model: "@cf/baai/bge-m3"
    target_dimensions: 1024
    migration_mode: reembed
    migration_state: staging-owned
    candidate_only: true
  - id: screen-activity
    # Reembedded on the shared multilingual model; the legacy timestamp range
    # filter maps to the created_at metadata index.
    legacy_namespace: ns3
    authoritative_source: screen-activity-repository
    source_model: google/gemini-embedding-001
    source_dimensions: 3072
    target: vectorize
    target_index: omi-cf-screen-activity-v1
    target_model: "@cf/baai/bge-m3"
    target_dimensions: 1024
    migration_mode: reembed
    migration_state: staging-owned
    candidate_only: true
  - id: action-items
    legacy_namespace: ns4
    authoritative_source: action-item-repository
    source_model: openai/text-embedding-3-large
    source_dimensions: 3072
    target: vectorize
    target_index: omi-cf-action-items-v2
    target_model: "@cf/baai/bge-m3"
    target_dimensions: 1024
    migration_mode: reembed
    migration_state: staging-owned
    candidate_only: true
  - id: transcript-chunks
    legacy_namespace: ns_tchunks
    authoritative_source: conversation-repository
    source_model: openai/text-embedding-3-large
    source_dimensions: 3072
    target: vectorize
    target_index: omi-cf-transcript-chunks-v2
    target_model: "@cf/baai/bge-m3"
    target_dimensions: 1024
    migration_mode: reembed
    migration_state: staging-owned
    candidate_only: true
