# Operator-run deployment: upstream's Python monolith plus the fork's shims,
# on any server. The reference implementation of the client contract.
schema_version: 1
target: self_hosted
identity_provider: better_auth
managed: false           # no upstream-managed credentials reach this build

capabilities:
  allow_direct_model_providers: false
  allow_byok: false
  allow_google_connectors: false   # Omi-owned OAuth apps are not the operator's
  allow_cloud_connectors: false
  marketplace_enabled: false       # first release ships curated integrations only
  model_downloads: false
  account_activation_fence: false
  sync_upload_batch_limit: 5
  max_request_bytes: 0
  push_provider: disabled
  realtime_relay: operator

data_plane:
  store: firestore_pg
  object_store: minio
  queue: redis
  vector: qdrant
  cache: redis

# URLs are templated from the brand manifest's domains; {api}, {auth}, {web},
# {mcp}, {share}, {objects} are substituted by render.py.
stages:
  production:
    api_base_url: "{api}/"
    auth_base_url: "{auth}"
    web_base_url: "{web}"
    mcp_base_url: "{mcp}"
    share_base_url: "{share}"
    objects_base_url: "{objects}"
    auth_callback_scheme: "{scheme}"
  beta:
    api_base_url: "{api}/"
    auth_base_url: "{auth}"
    web_base_url: "{web}"
    mcp_base_url: "{mcp}"
    share_base_url: "{share}"
    objects_base_url: "{objects}"
    auth_callback_scheme: "{scheme}-beta"
  local:
    api_base_url: http://127.0.0.1:8100/
    auth_base_url: http://127.0.0.1:3000
    web_base_url: http://127.0.0.1:3001
    mcp_base_url: http://127.0.0.1:8100
    share_base_url: http://127.0.0.1:8100
    objects_base_url: http://127.0.0.1:9000
    auth_callback_scheme: "{scheme}-dev"

# Public, reproducible reference model. Both profile capability and the runtime
# migration derive dimension from this identity; endpoint/credentials stay env.
embedding:
  provider: ollama
  model: bge-m3:latest
  manifest_digest: sha256:7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab
  artifact_digest: sha256:daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c
  dimension: 1024
  context_length: 8192

# One licensed, content-addressed CPU bundle; capabilities derive from it.
# Omitting this bundle explicitly disables STT/TTS at their real consumers.
speech:
  runtime_version: 1.13.4
  stt_model: sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
  tts_model: kokoro-multi-lang-v1_0
  bundle_digest: sha256:75734cf4e9c25611e1c4676ce37b5946eb12fa22c03a41a794371cfea0031b0a
  stt_archive_digest: sha256:7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e
  tts_archive_digest: sha256:c133d26353d776da730870dac7da07dbfc9a5e3bc80cc5e8e83ab6e823be7046
  vad_digest: sha256:1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3
