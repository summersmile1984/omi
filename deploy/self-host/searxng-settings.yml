# LIFECYCLE: permanent
# The public JSON API is consumed only over the private Compose network.
use_default_settings:
  engines:
    keep_only:
      - wikipedia

server:
  bind_address: "0.0.0.0"
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json

engines:
  - name: wikipedia
    disabled: false
