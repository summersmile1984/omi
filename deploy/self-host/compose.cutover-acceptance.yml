# LIFECYCLE: permanent
# Adds a local TLS edge to the production profile. Never use the generated
# acceptance CA/key as a production certificate.
services:
  https-proxy:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: "no"
    ports:
      - "127.0.0.1:${CUTOVER_HTTPS_PORT:?CUTOVER_HTTPS_PORT is required}:443"
    volumes:
      - ./nginx.cutover-acceptance.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CUTOVER_TLS_CERT_PATH:?CUTOVER_TLS_CERT_PATH is required}:/etc/nginx/tls/server.crt:ro
      - ${CUTOVER_TLS_KEY_PATH:?CUTOVER_TLS_KEY_PATH is required}:/etc/nginx/tls/server.key:ro
    networks:
      default:
        aliases:
          - api.omi.test
          - auth.omi.test
          - mcp.omi.test
          - objects.omi.test
    depends_on:
      auth-server:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --no-check-certificate --spider --header='Host: api.omi.test' https://127.0.0.1/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
