# LIFECYCLE: permanent
# Local acceptance proxy for the same public-origin contract production uses.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 300s;

server {
    listen 443 ssl;
    server_name auth.omi.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    location ^~ /internal/ { return 404; }
    location / { proxy_pass http://auth-server:3000; }
}

server {
    listen 443 ssl;
    server_name api.omi.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    location / { proxy_pass http://backend:8080; }
}

server {
    listen 443 ssl;
    server_name mcp.omi.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    location / {
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://backend:8080;
    }
}

server {
    listen 443 ssl;
    server_name objects.omi.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    client_max_body_size 100m;
    location / { proxy_pass http://minio:9000; }
}
