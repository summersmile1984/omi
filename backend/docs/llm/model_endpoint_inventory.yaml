schema_version: llm_model_endpoint_inventory.v1
scope:
  in_scope: backend chat/completion/generation/model calls, including streaming, tool calling, image generation, file chat, realtime relay, and provider web search
  out_of_scope: legacy provider-native helpers that are not used by the capability routes
out_of_scope_surfaces:
  - surface: openai_embeddings
    code_path: backend/utils/llm/clients.py:OpenAIEmbeddings,generate_embedding
    provider_model: openai/text-embedding-3-large
    request_shape: embedding
    reason: Legacy compatibility helper; desktop capability callers use the provider-neutral route.
  - surface: gemini_screen_activity_query_embedding
    code_path: backend/utils/llm/clients.py:gemini_embed_query
    provider_model: gemini/embedding-001
    request_shape: embedding
    reason: Legacy compatibility helper; screen search preflights the provider-neutral embedding boundary.
provider_neutral_capabilities:
  status: authenticated_typed_routes
  code_path: backend/routers/model_capabilities.py
  routes:
    - POST /v1/model-capabilities/embeddings
    - POST /v1/model-capabilities/tool-completions
    - GET /v1/model-capabilities/realtime
    - WEBSOCKET /v1/model-capabilities/realtime/relay
  route_source: backend/utils/llm/capabilities.py
  embedding_source: backend/utils/llm/embedding_providers.py
  neutral_contract: self_hosted deployments require explicit provider/model/endpoint/credential values and return typed unavailable responses; checked-in vendor profiles never become implicit routes.
  realtime_contract: server-selected provider or an allowlisted operator websocket relay; legacy omni and desktop mint routes cannot override the deployment-selected relay.
model_config_features:
  status: gateway_lane_generated_from_model_config
  source_of_truth: backend/utils/llm/model_config.py
  gateway_lane: omi:auto:<feature-with-underscores-as-hyphens>
  code_paths:
    - backend/utils/llm/clients.py:get_llm
    - backend/llm_gateway/gateway/config_loader.py:_generated_feature_route_items
  request_shapes:
    plain_chat:
      - public_shared_conversation_chat
      - conv_action_items
      - conv_app_result
      - conv_discard
      - conv_folder
      - conv_structure
      - daily_summary
      - daily_summary_simple
      - followup
      - goals
      - goals_advice
      - knowledge_graph
      - learnings
      - memories
      - memory_category
      - memory_conflict
      - memory_conflict_flex
      - memory_l1
      - memory_l2_flex
      - notifications
      - onboarding
      - openglass
      - persona_chat
      - persona_chat_premium
      - persona_clone
      - session_titles
      - smart_glasses
      - wrapped_analysis
      - x_memory_extraction_flex
      - app_generator
      - app_integration
    structured_output:
      - chat_extraction
      - conv_app_select
      - desktop_proactive_extraction
      - desktop_proactive_reasoning
      - external_structure
      - proactive_notification
      - translation
      - trends
      - what_matters_now
    streaming:
      - chat_responses
      - chat_graph
      - persona_chat
      - persona_chat_premium
    tool_calling:
      - chat_agent
      - memory_l2
    provider_search:
      - web_search
    pinned:
      - fair_use
  gateway_capability_needed: OpenAI-compatible chat-completions lane with deployment-resolved provider/model/fallback identities; optional native managed adapters remain explicit.
  migration_status: get_llm resolves one per-feature manifest in direct and gateway modes; optional unconfigured fallbacks are filtered, configured fallbacks switch only for timeout/429/5xx, and self-host uses an explicit generic endpoint without a managed credential fallback.
  test_guardrail_coverage:
    - backend/tests/unit/test_llm_gateway_coverage_guardrails.py::test_every_model_config_feature_has_inventory_and_gateway_lane
    - backend/tests/unit/test_llm_gateway_client_config.py::test_get_llm_feature_gateway_mode_uses_generated_auto_lane
surfaces:
  - surface: desktop_context_proactivity
    code_path: backend/routers/desktop_proactivity.py:proactive_completion
    current_provider_model: gateway lanes desktop_proactive_extraction and desktop_proactive_reasoning; explicit direct manifest routes support generic/openai/openrouter/deepseek/mimo with bounded fallback; legacy direct OpenAI recovery remains dev/local only
    request_shape: non-streaming strict structured output with optional explicit prompt caching on reasoning
    gateway_lane_capability_needed: OpenAI-compatible structured-output lanes with explicit-cache support for reasoning
    migration_status: acknowledged_direct_provider_neutral_manifest_route; optional unconfigured fallbacks are filtered and 429/5xx/timeout alone may switch providers
    test_guardrail_coverage: backend/tests/unit/test_desktop_proactivity.py and backend/tests/unit/test_llm_gateway_coverage_guardrails.py
  - surface: public_shared_conversation_chat
    code_path: backend/routers/public_shared_conversation_chat.py:public_shared_conversation_chat
    current_provider_model: gateway-only deployment manifest route; checked-in cloud default is openai/gpt-5-nano
    request_shape: non-streaming plain chat with server-resolved shared transcript, at most eight user/assistant history entries, and no tools or retrieval
    gateway_lane_capability_needed: dedicated non-streaming no-tools omi:auto:public-shared-conversation-chat lane
    migration_status: gateway_only_trusted_frontend_bff
    deployment_route_contract: dedicated lane provider/model follows OMI_LLM_ROUTE_PUBLIC_SHARED_CONVERSATION_CHAT_* or the deployment-wide route
    test_guardrail_coverage: backend/tests/unit/test_public_shared_conversation_chat.py and web/frontend/src/__tests__/shared-conversation-chat-contract.test.mjs
  - surface: langchain_feature_routing
    code_path: backend/utils/llm/clients.py:get_llm
    current_provider_model: utils.llm.model_config feature profile
    request_shape: plain chat, structured output, parser chain, streaming, tool calling via LangChain
    gateway_lane_capability_needed: generated feature lanes
    migration_status: gateway_capable_central_flip
    test_guardrail_coverage: backend/tests/unit/test_llm_gateway_coverage_guardrails.py
  - surface: anthropic_agentic_chat
    code_path: backend/utils/llm/gateway_anthropic.py:_GatewayAnthropicStream
    current_provider_model: chat_agent manifest route; managed Anthropic Messages and generic OpenAI-compatible tool loops are explicit alternatives
    request_shape: streaming native or OpenAI-compatible tool calling
    gateway_lane_capability_needed: deployment-resolved tool-capable omi:auto:chat-agent lane
    migration_status: provider_neutral_manifest_route; generic direct/gateway use the same bounded tool loop, while managed Anthropic transport failures remain typed and never construct an undeclared direct fallback
    test_guardrail_coverage: backend/tests/unit/test_gateway_anthropic_client.py and backend/tests/unit/test_model_neutral_routing.py
  - surface: web_search_tool
    code_path: backend/utils/retrieval/tools/web_search_tools.py:web_search_tool
    current_provider_model: deployment-selected SearXNG transport or managed web-search gateway lane
    request_shape: SearXNG JSON Search API or provider search chat completion
    gateway_lane_capability_needed: optional managed search provider adapter on omi:auto:web-search
    migration_status: provider_neutral_explicit_transport
    test_guardrail_coverage: backend/tests/unit/test_web_search_tools.py
  - surface: app_icon_generation
    code_path: backend/utils/llm/app_generator.py:generate_app_icon
    current_provider_model: deployment-selected local deterministic template, explicit OpenAI-compatible image endpoint, managed gateway, or typed disabled
    request_shape: local 1024px PNG rendering or bounded image generation
    gateway_lane_capability_needed: optional managed /v1/images/generations proxy only
    migration_status: provider_neutral_explicit_transport; local_template performs no network call and compatible mode has no endpoint or credential default
    test_guardrail_coverage: backend/tests/unit/test_image_generation_provider.py and backend/tests/unit/test_llm_gateway_client_config.py
  - surface: file_chat_vision
    code_path: backend/utils/other/chat_file.py:_ask_vision_stream
    current_provider_model: managed OpenAI vision only under explicit openai_assistants transport; local_extraction sends bounded private inline images through the chat_responses manifest
    request_shape: streaming vision chat completion or bounded inline-image generic completion
    gateway_lane_capability_needed: gateway-owned vision chat lane or file-chat replacement retrieval path
    migration_status: acknowledged_direct_file_lifecycle_surface for the explicit managed transport; self-host local_extraction is private, UID-scoped, provider-neutral, and does not construct an OpenAI client
    test_guardrail_coverage: backend/tests/unit/test_llm_gateway_coverage_guardrails.py and backend/tests/unit/test_local_file_chat.py
  - surface: file_chat_assistants
    code_path: backend/utils/other/chat_file.py:FileChatTool
    current_provider_model: explicit managed OpenAI Assistants transport or self-host local extraction plus chat_responses manifest route
    request_shape: managed file lifecycle, or private UID object upload with bounded text/PDF/DOCX/CSV/JSON/image extraction and streaming completion
    gateway_lane_capability_needed: gateway-owned file/assistant lifecycle or replacement retrieval path
    migration_status: acknowledged_direct_file_lifecycle_surface for the explicit managed transport; self-host local_extraction preserves the existing file wire without public objects or vendor lifecycle calls
    test_guardrail_coverage: backend/tests/unit/test_llm_gateway_coverage_guardrails.py and backend/tests/unit/test_local_file_chat.py
  - surface: omni_realtime_relay
    code_path: backend/routers/omni_relay.py
    current_provider_model: openai realtime or gemini live selected by client query
    request_shape: realtime websocket relay
    gateway_lane_capability_needed: gateway-owned realtime websocket relay
    migration_status: legacy surface blocked during OMI_LLM_GATEWAY_FEATURE_MODE=gateway and guarded by realtime deployment authority; relay/disabled deployments reject before vendor URL or key resolution
    test_guardrail_coverage: backend/tests/unit/test_llm_gateway_coverage_guardrails.py
  - surface: desktop_openai_compatible_chat
    code_path: backend/routers/desktop_chat.py:chat_completions
    current_provider_model: gateway auto lane when selected; otherwise chat_agent manifest through configured generic/openai/openrouter/deepseek/mimo wire targets
    request_shape: streaming/non-streaming OpenAI chat completions with tools, image parts, response_format, and authorized SearXNG public context derived only from the trusted user instruction
    gateway_lane_capability_needed: existing omi:auto:chat-agent
    migration_status: provider_neutral_direct_and_gateway_with_bounded_retryable_only_fallback
    test_guardrail_coverage: backend/tests/unit/test_desktop_chat.py
  - surface: desktop_gemini_proxy
    code_path: backend/routers/desktop_proxy.py:_proxy
    current_provider_model: managed Gemini/Vertex only when DESKTOP_VENDOR_PROXY_TRANSPORT=gemini
    request_shape: Gemini generateContent/streamGenerateContent/embedContent
    gateway_lane_capability_needed: none; optional legacy vendor surface
    migration_status: typed_disabled_in_self_host_before_vendor_routing
    test_guardrail_coverage: backend/tests/unit/test_desktop_proxy.py
  - surface: fair_use_classifier
    code_path: backend/utils/llm/fair_use_classifier.py:classify_user_purpose
    current_provider_model: openai/fair_use pinned feature
    request_shape: async plain chat JSON
    gateway_lane_capability_needed: generated omi:auto:fair-use lane
    migration_status: get_llm_routed
    test_guardrail_coverage: backend/tests/unit/test_llm_gateway_coverage_guardrails.py
  - surface: production_like_memory_ingestion
    code_path: backend/utils/memory_ingestion/adapters/production_like_model.py:_memory_llm
    current_provider_model: openai/memories feature
    request_shape: parser chain
    gateway_lane_capability_needed: generated omi:auto:memories lane
    migration_status: get_llm_routed
    test_guardrail_coverage: backend/tests/unit/test_llm_gateway_coverage_guardrails.py
  - surface: knowledge_graph_extract
    code_path: backend/routers/knowledge_graph.py:extract_knowledge_graph
    current_provider_model: openai/gpt-5.6-luna knowledge_graph feature
    request_shape: return-only entity/edge extraction JSON
    gateway_lane_capability_needed: generated omi:auto:knowledge-graph lane
    migration_status: get_llm_routed; desktop onboarding should call this instead of inventing graphs via chat_agent
    test_guardrail_coverage: backend/tests/unit/test_knowledge_graph_extract_route.py
  - surface: memories_extract
    code_path: backend/routers/memories.py:extract_memory_log
    current_provider_model: openai/gpt-5.6-luna memories feature
    request_shape: return-only memory-log JSON (memories + profile)
    gateway_lane_capability_needed: generated omi:auto:memories lane
    migration_status: get_llm_routed; desktop onboarding/import should call this instead of Haiku chat completions
    test_guardrail_coverage: backend/tests/unit/test_memories_extract_route.py
  - surface: connector_synthesis
    code_path: backend/routers/integrations.py:synthesize_connector_data
    current_provider_model: openai/gpt-5.6-luna memories feature
    request_shape: return-only calendar/gmail/notes memories + tasks + profile
    gateway_lane_capability_needed: generated omi:auto:memories lane
    migration_status: get_llm_routed; desktop connector importers should call this instead of Haiku chat completions
    test_guardrail_coverage: backend/tests/unit/test_connector_synthesis_route.py
  - surface: conversation_topic
    code_path: backend/routers/conversations.py:generate_conversation_topic_endpoint
    current_provider_model: openai/gpt-5.6-luna conv_structure feature
    request_shape: return-only emoji + short title for a finished transcript
    gateway_lane_capability_needed: generated omi:auto:conv-structure lane
    migration_status: get_llm_routed; desktop clients should call this instead of Haiku chat completions
    test_guardrail_coverage: backend/tests/unit/test_conversation_topic_route.py
  - surface: ai_user_profile_synthesis
    code_path: backend/routers/users.py:synthesize_ai_profile
    current_provider_model: openai/gpt-5.6-luna memories feature
    request_shape: return-only two-stage user profile document from desktop source lines
    gateway_lane_capability_needed: generated omi:auto:memories lane
    migration_status: get_llm_routed; desktop assistants should call this instead of Haiku chat completions
    test_guardrail_coverage: backend/tests/unit/test_ai_user_profile_route.py
