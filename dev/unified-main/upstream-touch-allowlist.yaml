# T1 白名单：允许被 fork 修改的上游文件（唯一来源）
#
# 规则（见 00-upstream-touch-policy.md）：
#   - 默认零改动。不在本表中的上游文件出现在 PR diff 中 → fork-upstream-touch 失败。
#   - 每条必须有 max_added_lines（≤3）、reason、upstream_pr（提案须明确标记，不能冒充已开 PR）。
#   - 只减不增：上游接受对应 PR 后，删除该条并回退 fork 的改动。
#   - backend/**、上游测试、锁文件/依赖清单、生成文件、机器人写入文件、CI 工作流：永远不得入表。
schema_version: 1

forbidden_patterns:            # 命中即失败，白名单也不能豁免（T2）
  - "backend/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/*_test.*"
  - "**/*.test.*"
  - "**/Tests/**"
  - "backend/pylock*.toml"
  - "backend/requirements*.txt"
  - "app/pubspec.lock"
  - "web/*/package-lock.json"
  - "**/*.g.dart"
  - "**/*.gen.dart"
  - "app/lib/l10n/app_localizations*.dart"
  - ".github/workflows/**"
  - ".github/checks-manifest.yaml"
  - ".github/guardrail-pulse-history.jsonl"
  - "config/deployment-setting-classification.json"
  - "desktop/macos/CHANGELOG.json"
  - "community-plugin-stats.json"

forbidden_exceptions:        # 精确路径（禁通配符）。豁免的只是"绝不修改"这一条；
                             # 该文件仍必须在下面 allow: 里有条目和行数预算。
                             # 只减不增：上游接受修复后立刻删除本条与对应改动。

allow:
  - path: app/lib/flavors.dart
    max_added_lines: 3
    reason: 仅一个 import 与两个 F.title 返回值读取生成的品牌常量；品牌与生成逻辑归 fork，禁止扩展为业务入口
    upstream_pr: "PROPOSED (not opened): brand-configurable app title; retire when upstream accepts configuration"
    owner: B2

  # Upstream's own capture ratchet drifted: C1 (#14327) recorded
  # singleton-reads: 2, then #14529/#14549/#14550 grew the file to 4 without
  # updating the record, so every later diff touching the file fails
  # scripts/check_mobile_boundaries.py at upstream/main itself. This one-line
  # record update restates the already-merged upstream code; it cannot legalize
  # this sync's first-time appearance of the file (the check limits new files to
  # zero regardless of baseline), only steady-state runs after the sync lands.
  - path: app/contracts/capture/boundary-baseline.json
    max_added_lines: 1
    reason: capture_seams.dart 的 singleton-reads 债务记录落后于上游已合并代码（2→4），棘轮检查的既定补救即更新 baseline
    upstream_pr: "PROPOSED (not opened): record current singleton-reads debt for capture_seams; retire when upstream accepts"
    owner: C-sync

  # Upstream #18722 (43c27b740c) deleted backend/utils/task_intelligence/rollout.py
  # while leaving its scope_hint behind in this FC definition; scripts/failure-class
  # rightly fails a hint that matches zero tracked paths. Retargeting the hint to
  # the surviving task_intelligence directory keeps the class's scope honest; the
  # alternative (deleting the hint) loses information the validator is happy to keep.
  - path: .github/failure-classes/FC-gate-principal-outside-consolidated-entitlement.json
    max_added_lines: 1
    reason: 上游删除 rollout.py 后遗留死 scope_hint，检查要求 hint 至少命中一个跟踪路径；改指同域存活目录
    upstream_pr: "PROPOSED (not opened): drop or retarget the dead rollout.py scope hint; retire when upstream accepts"
    owner: C-sync

  # AGENTS.md pointers were tried on 2026-09-03 and removed the same day.
  # Upstream keeps these files at their guardrail ceiling -- app/AGENTS.md was
  # 11288/11500 bytes and backend/AGENTS.md 38997/39000 -- so a one-line fork
  # pointer fails agents-md-lean as soon as upstream grows into the headroom.
  # Fork rules live in fork-owned AGENTS.fork.md files with no pointer from the
  # upstream file; discovery comes from dev/unified-main/ and this policy doc.
