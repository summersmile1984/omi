plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
}

// Firebase is an opt-in native dependency for managed flavors. The selfhost
// flavor must remain buildable without a google-services.json or a Crashlytics
// project, even when the shared Flutter dependency graph contains Firebase
// packages. The task-name check protects direct `flutter build --flavor
// selfhost` invocations; the environment check also covers release wrappers
// that make the profile explicit.
def selfHostedBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains('selfhost')
}
def firebaseServicesEnabled = !selfHostedBuild && (System.getenv('OMI_FIREBASE_SERVICES_ENABLED') ?: 'true').toBoolean()
if (firebaseServicesEnabled) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def env = new Properties()
def envFile = rootProject.file("../.env")
if (envFile.exists()) {
    envFile.withInputStream { stream ->
        env.load(stream)
    }
}


kotlin {
    jvmToolchain(21)
}

android {

    buildFeatures {
        buildConfig = true
    }

    namespace "com.friend.ios"


    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions += "flavor-type"

    productFlavors {
        prod {
            dimension "flavor-type"
            applicationId "com.friend.ios"
            resValue "string", "app_name", "Omi"
        }
        selfhost {
            dimension "flavor-type"
            applicationId "com.friend.ios.selfhost"
            resValue "string", "app_name", "Omi Self-Hosted"
            // Never inherit operator-managed support credentials from the
            // shared .env used by the prod flavor.
            buildConfigField "String", "INTERCOM_APP_ID", '""'
            buildConfigField "String", "INTERCOM_ANDROID_API_KEY", '""'
        }
        dev {
            dimension "flavor-type"
            applicationId "com.friend.ios.dev"
            resValue "string", "app_name", "Omi Dev"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.friend.ios"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField("String", "INTERCOM_APP_ID", "\"${env.getProperty('INTERCOM_APP_ID', '')}\"")
        buildConfigField("String", "INTERCOM_ANDROID_API_KEY", "\"${env.getProperty('INTERCOM_ANDROID_API_KEY', '')}\"")
        buildConfigField("boolean", "SELF_HOSTED", "false")
    }

    signingConfigs {
        release {
            if (System.getenv()["CI"]) { // CI=true is exported by Codemagic
                storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["CM_KEY_ALIAS"]
                keyPassword System.getenv()["CM_KEY_PASSWORD"]
            } else {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
        debug {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            productFlavors.dev.signingConfig signingConfigs.debug
            productFlavors.prod.signingConfig signingConfigs.release
            productFlavors.selfhost.signingConfig signingConfigs.release
            // fixing calendar
            // https://github.com/builttoroam/device_calendar/issues/99#issuecomment-612449677
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled true
            shrinkResources true
        }
        debug{
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled true
        }
    }

    ndkVersion System.getenv()["NDK_VERSION"] ?: "28.2.13676358"
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0-alpha3'
    implementation 'io.intercom.android:intercom-sdk:latest.release'
    implementation 'com.twilio:voice-android:6.10.2'
}

// Local dev uses the non-production Firebase emulator project. Do not try to
// upload its mapping files to Crashlytics; production variants retain uploads.
if (firebaseServicesEnabled) {
    tasks.matching { task -> task.name.startsWith('uploadCrashlyticsMappingFileDev') }.configureEach {
        enabled = false
    }
}
